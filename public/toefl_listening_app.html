<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Longman TOEFL — Listening Short Dialogues</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f0;
      color: #1a1a18;
      min-height: 100vh
    }

    .app {
      padding: 1.5rem 1rem;
      max-width: 860px;
      margin: 0 auto
    }

    .header {
      text-align: center;
      margin-bottom: 1.25rem
    }

    .header h1 {
      font-size: 20px;
      font-weight: 600;
      color: #1a1a18
    }

    .header p {
      font-size: 13px;
      color: #666;
      margin-top: 3px
    }

    .tabs-wrap {
      overflow-x: auto;
      margin-bottom: .75rem;
      padding-bottom: 4px
    }

    .tabs {
      display: flex;
      gap: 5px;
      width: max-content
    }

    .tab {
      padding: 6px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      background: #fff;
      color: #555;
      transition: all .15s;
      white-space: nowrap
    }

    .tab.active {
      background: #e6f1fb;
      color: #185FA5;
      border-color: #185FA5
    }

    .tab:hover:not(.active) {
      background: #f0f0ec
    }

    .progress-bar {
      background: #e8e8e4;
      border-radius: 999px;
      height: 5px;
      margin-bottom: 1rem;
      overflow: hidden
    }

    .progress-fill {
      height: 100%;
      background: #185FA5;
      border-radius: 999px;
      transition: width .3s
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-bottom: 1.25rem
    }

    .stat {
      background: #fff;
      border-radius: 8px;
      padding: .65rem;
      text-align: center;
      border: 1px solid #e0e0d8
    }

    .stat-num {
      font-size: 18px;
      font-weight: 600;
      color: #1a1a18
    }

    .stat-lbl {
      font-size: 11px;
      color: #888;
      margin-top: 1px
    }

    .card {
      background: #fff;
      border: 1px solid #e0e0d8;
      border-radius: 12px;
      padding: 1.1rem;
      margin-bottom: .9rem
    }

    .q-meta {
      font-size: 12px;
      color: #666;
      margin-bottom: .5rem;
      display: flex;
      gap: 7px;
      align-items: center;
      flex-wrap: wrap
    }

    .badge {
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600
    }

    .badge-ex {
      background: #fff8e1;
      color: #b45309
    }

    .badge-toefl {
      background: #e6f1fb;
      color: #185FA5
    }

    .badge-rev {
      background: #e8f5e9;
      color: #1a7a4a
    }

    .dialogue {
      background: #f8f7f2;
      border-radius: 8px;
      padding: .8rem;
      margin-bottom: .85rem;
      font-size: 13px;
      line-height: 1.75
    }

    .dialogue .speaker {
      font-weight: 600;
      color: #1a1a18;
      margin-right: 5px
    }

    .dialogue .line {
      font-style: italic;
      color: #444
    }

    .dialogue .narrator-line {
      margin-top: 5px;
      font-weight: 600;
      color: #185FA5;
      font-size: 12px
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 7px
    }

    .opt {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      padding: 9px 12px;
      border: 1px solid #e0e0d8;
      border-radius: 8px;
      cursor: pointer;
      transition: all .15s;
      font-size: 13px;
      color: #1a1a18;
      background: #fff
    }

    .opt:hover:not(.disabled) {
      background: #f5f5f0
    }

    .opt.correct {
      border-color: #1a7a4a;
      background: #e8f5e9;
      color: #1a7a4a
    }

    .opt.wrong {
      border-color: #b91c1c;
      background: #fef2f2;
      color: #b91c1c
    }

    .opt.disabled {
      cursor: default
    }

    .opt-label {
      font-weight: 700;
      min-width: 18px;
      flex-shrink: 0
    }

    .explanation {
      margin-top: .65rem;
      padding: .7rem;
      background: #f8f7f2;
      border-radius: 8px;
      font-size: 12.5px;
      color: #555;
      line-height: 1.65;
      border-left: 3px solid #185FA5
    }

    .explanation strong {
      color: #1a1a18;
      font-weight: 600
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: .85rem;
      flex-wrap: wrap;
      gap: 7px
    }

    .nav-btn {
      padding: 7px 18px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      background: #fff;
      color: #1a1a18;
      transition: all .15s
    }

    .nav-btn:hover {
      background: #f0f0ec
    }

    .nav-btn.primary {
      background: #185FA5;
      color: #fff;
      border-color: #185FA5
    }

    .nav-btn.primary:hover {
      background: #0C447C
    }

    .nav-btn:disabled {
      opacity: .4;
      cursor: default
    }

    .q-counter {
      font-size: 12px;
      color: #888
    }

    .score-screen {
      text-align: center;
      padding: 2.5rem 1rem
    }

    .score-big {
      font-size: 52px;
      font-weight: 700;
      color: #185FA5
    }

    .score-label {
      font-size: 15px;
      color: #666;
      margin: 4px 0 1.5rem
    }

    .score-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-width: 360px;
      margin: 0 auto 1.5rem
    }

    .note {
      font-size: 12px;
      color: #555;
      font-style: italic;
      margin-bottom: .7rem;
      padding: .5rem .75rem;
      background: #f0f7ff;
      border-radius: 8px;
      border-left: 3px solid #185FA5
    }

    .audio-note {
      font-size: 12px;
      color: #888;
      padding: .5rem .75rem;
      background: #f8f7f2;
      border-radius: 8px;
      margin-bottom: .85rem;
      display: flex;
      align-items: center;
      gap: 6px
    }

    .tab.part-a {
      background: #fff8e1;
      color: #b45309;
      border-color: #f59e0b;
      font-weight: 700
    }

    .tab.part-a.active {
      background: #b45309;
      color: #fff;
      border-color: #b45309
    }

    .badge-parta {
      background: #fff8e1;
      color: #b45309
    }

    .note-parta {
      background: #fffbeb;
      border-left: 3px solid #f59e0b;
      color: #78350f
    }
  </style>
</head>

<body>
  <div class="app" id="root"></div>
  <script>
    const DATA = {

      ex2: {
        label: "Exercise 2 — Synonyms", type: "exercise",
        note: "Pilih jawaban yang mengandung sinonim dari kata kunci di baris terakhir dialogue.",
        qs: [
          { d: [{ s: "(woman)", l: "Did you see the manager about the job in the bookstore?" }, { s: "(man)", l: "Yes, and I also had to fill out an application." }, { s: "(narrator)", l: "What does the man mean?", q: true }], opts: ["He got a job as bookstore manager.", "The bookstore was not accepting applications.", "He saw a book about how to apply for jobs.", "It was necessary to complete a form."], ans: 3, exp: "Key word: 'fill out an application' → synonym: 'complete a form' (D). Fill out = complete; application = form." },
          { d: [{ s: "(man)", l: "We're planning to leave for the trip at about 2:00." }, { s: "(woman)", l: "Couldn't we leave before noon?" }, { s: "(narrator)", l: "What does the woman ask?", q: true }], opts: ["If they could leave at noon", "If it is possible to go by 12:00", "Why they can't leave at noon", "If they could leave the room"], ans: 1, exp: "'Before noon' = 'by 12:00'. The woman wants to leave earlier — noon = 12:00." },
          { d: [{ s: "(man)", l: "Was the concert well-received?" }, { s: "(woman)", l: "The audience applauded for a long time after the performance." }, { s: "(narrator)", l: "What does the woman say about the concert?", q: true }], opts: ["The performance went on for a long time.", "There was applause throughout the performance.", "The people clapped on and on after the concert.", "The audience waited for a long time for the concert to begin."], ans: 2, exp: "'Applauded' = 'clapped'; 'long time after the performance' = 'on and on after the concert'. Option C has the best synonyms." },
        ]
      },

      toefl_ex2: {
        label: "TOEFL Exercise 2 — Synonyms", type: "toefl",
        note: "Audio-based. Look for synonyms for key words in the last line of each dialogue.",
        qs: [
          { d: [], opts: ["The final exam was harder than the others.", "There were two exams rather than one.", "He thought the exam would be easier.", "The exam was not very difficult."], ans: 3, exp: "'Didn't do well' due to insufficient study → result implies exam difficulty was appropriate; 'not very difficult' is the synonym paraphrase here." },
          { d: [], opts: ["He's not feeling very well.", "He's rather sick of working.", "He's feeling better today than yesterday.", "He'd really rather not answer the question."], ans: 0, exp: "Key implication: not well → 'He's not feeling very well' is the direct paraphrase." },
          { d: [], opts: ["The company was founded about a year ago.", "It was just established that he could go into business.", "The family is well-established.", "The business only lasted a year."], ans: 0, exp: "'Just started/established recently' ≈ 'founded about a year ago'." },
          { d: [], opts: ["He did not look at the right schedule.", "The plane landed in the right place.", "The plane arrived on time.", "He had to wait for the plane to land."], ans: 2, exp: "Dialogue implies plane arrived as scheduled → 'arrived on time'." },
          { d: [], opts: ["She'd rather go running.", "She doesn't want to go into the pool.", "She'll change clothes quickly and go swimming.", "She needs a sweatsuit to go running."], ans: 1, exp: "She does not want to swim → 'doesn't want to go into the pool'." },
          { d: [], opts: ["The firefighters saved the homes for last.", "A firefighter saved the hillside last night.", "The homes on the hillside were burned.", "The houses weren't destroyed."], ans: 3, exp: "'Firefighters saved' = houses were NOT destroyed. Option D." },
          { d: [], opts: ["There's enough soup.", "The spices are adequate.", "She thinks the soup's too salty.", "The man should add more salt and pepper."], ans: 2, exp: "Key word relates to saltiness → 'soup's too salty'." },
          { d: [], opts: ["He was lucky to receive a grant for his studies.", "He used his fortune to pay his fees.", "He is a scholar at a college with low fees.", "He paid to get a scholarship."], ans: 0, exp: "'Won a scholarship' = 'lucky to receive a grant for his studies.'" },
          { d: [], opts: ["It profited from previous mistakes.", "It earned a lot of money.", "This was the last year that it would make a profit.", "It was not so successful."], ans: 3, exp: "Last line implies limited success → 'not so successful'." },
          { d: [], opts: ["Chuck's bank account has too much money in it.", "He thinks Chuck has the wrong kind of bank account.", "He thinks that Chuck is on his way home from the bank.", "There isn't enough money in Chuck's account."], ans: 3, exp: "Dialogue implies insufficient funds → 'there isn't enough money in Chuck's account'." },
        ]
      },

      ex3: {
        label: "Exercise 3 — Avoid Similar Sounds", type: "exercise",
        note: "Jawaban yang benar BUKAN yang mengandung bunyi mirip dari kata kunci di baris terakhir.",
        qs: [
          { d: [{ s: "(woman)", l: "I heard that Sally just moved into a new, big house near the beach." }, { s: "(man)", l: "But Sally doesn't have a cent!" }, { s: "(narrator)", l: "What does the man mean?", q: true }], opts: ["Sally has no sense of responsibility.", "Sally sent her friend to the house.", "Sally has no money.", "Sally is on the set with her."], ans: 2, exp: "'Cent' = money. Sound traps: 'sense' (A), 'sent' (B), 'set' (D). Correct answer: C — 'no money'." },
          { d: [{ s: "(woman)", l: "Did they get the new car they wanted?" }, { s: "(man)", l: "No, they lacked the money." }, { s: "(narrator)", l: "What does the man mean?", q: true }], opts: ["They locked the map in a car.", "They looked many times in the car.", "It cost a lot of money when the car leaked oil.", "They didn't have enough money to buy another car."], ans: 3, exp: "'Lacked the money' = didn't have enough money. Sound traps: 'locked' (A), 'looked' (B), 'leaked' (C)." },
          { d: [{ s: "(man)", l: "Have you finished packing yet?" }, { s: "(woman)", l: "You should call the porter to get the suitcases." }, { s: "(narrator)", l: "What does the woman mean?", q: true }], opts: ["It's important to pack the suitcases.", "They need help carrying their bags.", "The man should pack his suit in case he needs it.", "The suitcases are quite portable."], ans: 1, exp: "'Porter' = someone who carries bags = 'help carrying their bags'. Sound trap: 'suitcase/suit case' (C)." },
        ]
      },

      toefl_ex3: {
        label: "TOEFL Exercise 3 — Similar Sounds", type: "toefl",
        note: "Audio-based. Careful to avoid answers with similar sounds — correct answer rephrases the MEANING.",
        qs: [
          { d: [], opts: ["She has to wait for some cash.", "The waiter is bringing a glass of water.", "The lawn is too dry.", "She needs to watch out for a crash."], ans: 0, exp: "Sound traps: 'water', 'lawn/watch', 'crash'. Correct inference: she needs cash." },
          { d: [], opts: ["The sweater's the wrong size.", "The man's feet aren't sweating.", "The sweater makes the man seem fat.", "The sweet girl doesn't feel right."], ans: 0, exp: "Sweater doesn't fit → 'wrong size'. Sound traps: 'sweating' (B), 'sweet' (D)." },
          { d: [], opts: ["He has been regularly using a computer.", "He communicates with a Boston company.", "He regularly goes to communities around Boston.", "He has been traveling back and forth to Boston."], ans: 3, exp: "Frequent travel to Boston → 'traveling back and forth to Boston'." },
          { d: [], opts: ["He thought the lesson didn't matter.", "He couldn't learn the lesson.", "He learned a massive number of details.", "He didn't like most of the lesson."], ans: 3, exp: "'Didn't like most' captures the meaning correctly." },
          { d: [], opts: ["Some animals started the first fire.", "Animals are killed by forest fires.", "In the first frost, animals die.", "Frost can kill animals."], ans: 3, exp: "'Frost can kill animals.' Sound traps: 'first fire' (A), 'first frost' (C)." },
          { d: [], opts: ["Twenty pairs of shoes are on sale.", "The shoe salesclerk spent twenty dollars on pears.", "The shoes cost twenty dollars.", "The shoes could be repaired for twenty dollars."], ans: 2, exp: "The shoes cost twenty dollars. Sound trap: 'pairs/pears' (B)." },
          { d: [], opts: ["Tom tended to dislike biology lab.", "Attendance wasn't necessary at biology lab.", "Tom went to biology lab.", "There was a tendency to require biology lab."], ans: 2, exp: "Tom went to biology lab. Avoid 'tended/tendency' sound traps." },
          { d: [], opts: ["The meal will be served at noon.", "The males should be driven there by noon.", "He's expecting the ice to melt before noon.", "The letters ought to be delivered at 12:00."], ans: 0, exp: "'Meal served at noon'. Avoid 'males/meal' sound trap." },
          { d: [], opts: ["The weather will probably get worse later.", "The newspaper headlines described a bad storm.", "There was news about a headstrong man.", "He had a new bed."], ans: 0, exp: "Weather getting worse. Avoid 'head/headlines' and 'new/news' sound traps." },
          { d: [], opts: ["If she could do the grocery shopping", "If she prefers cooked vegetables or salad", "If she could help prepare the salad", "If she minds shopping for vegetables"], ans: 2, exp: "About helping prepare the salad. Avoid 'grocery/cooked' sound traps." },
        ]
      },

      ex4: {
        label: "Exercise 4 — Who, What, Where", type: "exercise",
        note: "Draw conclusions about who is speaking, what they are doing, and where the conversation takes place.",
        qs: [
          { d: [{ s: "(man)", l: "I'd like to deposit this check in my account, please." }, { s: "(woman)", l: "Would you like any cash back?" }, { s: "(narrator)", l: "Who is the woman?", q: true }], opts: ["A store clerk", "A bank teller", "An accountant", "A waitress"], ans: 1, exp: "'Deposit a check' + 'cash back' = banking transaction. The woman is a bank teller." },
          { d: [{ s: "(woman)", l: "Have you deposited your paycheck yet?" }, { s: "(man)", l: "No, but that's next on my list of errands." }, { s: "(narrator)", l: "What will the man probably do next?", q: true }], opts: ["Earn his paycheck", "Write a check for a deposit on an apartment", "Go to a bank", "Make a list of errands to run"], ans: 2, exp: "Depositing paycheck is 'next on his list of errands' → he will go to a bank." },
          { d: [{ s: "(man)", l: "Did you get the bread, eggs, and milk?" }, { s: "(woman)", l: "Now we need to stand in line at the checkout counter." }, { s: "(narrator)", l: "Where does this conversation probably take place?", q: true }], opts: ["In a restaurant", "At a bakery", "On a farm", "In a market"], ans: 3, exp: "'Bread, eggs, milk' + 'checkout counter' = supermarket/market setting." },
        ]
      },

      toefl_ex4: {
        label: "TOEFL Exercise 4 — Who, What, Where", type: "toefl",
        note: "Audio-based. Draw conclusions about who, what, and where.",
        qs: [
          { d: [], opts: ["In a photography studio", "In a biology laboratory", "In an office", "In the library"], ans: 2, exp: "Dialogue context clues suggest a professional office setting." },
          { d: [], opts: ["He's a pilot.", "He's a flight attendant.", "He's a member of the ground crew.", "He works clearing land."], ans: 0, exp: "Dialogue clues suggest the man is a pilot." },
          { d: [], opts: ["Wash the dishes immediately", "Use as many dishes as possible", "Wash the dishes for as long as possible", "Wait until later to clean up"], ans: 0, exp: "Dialogue implies wash dishes right away." },
          { d: [], opts: ["In a bank", "In a restaurant", "At a service station", "In a beauty salon"], ans: 3, exp: "Dialogue context clues suggest a beauty salon." },
          { d: [], opts: ["A salesclerk in a shoe store", "A shoe repairperson", "A party caterer", "A salesclerk in a fixtures department"], ans: 0, exp: "Dialogue clues suggest a shoe store salesclerk." },
          { d: [], opts: ["On a playground", "In a parking lot", "At a zoo", "In a photo studio"], ans: 3, exp: "Dialogue context clues suggest a photo studio." },
          { d: [], opts: ["Respond to the mail", "Put the letters in a file", "Create a pending file", "File the answers she received to the letters"], ans: 3, exp: "Dialogue implies filing/organizing letters." },
          { d: [], opts: ["In an airplane", "In a police car", "In a theater", "At a fireworks exhibit"], ans: 3, exp: "Dialogue clues suggest a fireworks exhibit." },
          { d: [], opts: ["Take care of Bob", "Invite Bob to dinner", "Let Bob know that they accept his invitation", "Respond to the woman's question"], ans: 2, exp: "Dialogue implies letting Bob know they accept his invitation." },
          { d: [], opts: ["A pharmacist", "A dentist", "A teacher", "A business manager"], ans: 1, exp: "Dialogue context clues suggest a dentist." },
        ]
      },

      toefl_ex5: {
        label: "TOEFL Exercise 5 — Passives", type: "toefl",
        note: "Audio-based. Be particularly careful of passive voice — who is doing what to whom.",
        qs: [
          { d: [], opts: ["If the restaurant is on the corner", "If the man would like to go to the restaurant", "If the vegetables are fresh", "If vegetarian food can be obtained"], ans: 3, exp: "Passive: 'can be obtained' — focus on whether vegetarian food is available." },
          { d: [], opts: ["He admitted that he wanted to go to law school in the fall.", "The law school accepted him as a student.", "The law professor admitted that he would be a student in the fall semester.", "He would be admitted to law school after the fall semester."], ans: 1, exp: "Passive: 'was admitted' → the law school accepted him. Option B." },
          { d: [], opts: ["Mark's plants were cared for in his absence.", "Mark's plan was to be out of town.", "Mark was careful about his plans for the out-of-town trip.", "She was careful while Mark was gone."], ans: 0, exp: "Passive: 'plants were cared for' — someone took care of them while he was away." },
          { d: [], opts: ["The lights in the trees were destroyed in the storm.", "The storm damaged the trees.", "The falling trees destroyed a store.", "In the light the destruction of the storm could be seen."], ans: 1, exp: "Storm was the agent of destruction → 'the storm damaged the trees'." },
          { d: [], opts: ["She was broke from skiing.", "She went skiing in spite of her accident.", "Her leg was hurt on a skiing trip.", "Her skis were broken in the mountains."], ans: 2, exp: "Passive: 'leg was hurt' — her leg was injured during a skiing trip." },
          { d: [], opts: ["The road the horses took was long and hard.", "It was hard to find the hidden houses.", "The riders worked the horses too much.", "It was hard for people to ride the horses for long."], ans: 2, exp: "Active/passive: 'horses were worked hard' → 'riders worked the horses too much'." },
          { d: [], opts: ["He didn't want the coffee that the woman ordered.", "He wasn't sure if the woman wanted coffee.", "He assumed the woman had ordered coffee.", "He was unaware that coffee had already been ordered."], ans: 3, exp: "Passive: 'coffee had already been ordered' — he didn't know it was taken care of." },
          { d: [], opts: ["The car was in the left parking lot at the airport.", "The friends parked their car at the airport.", "The airport couldn't hold a lot of cars.", "There were a lot of cars to the left of the parking lot."], ans: 1, exp: "The friends (active) parked their car at the airport." },
          { d: [], opts: ["The students pointed at Mac.", "Mac was present when the other students made the appointment.", "The class representative suggested Mac to the other students.", "Mac was chosen by his classmates to represent them."], ans: 3, exp: "Passive: 'Mac was chosen by his classmates' — they selected him." },
          { d: [], opts: ["After the earthquake, the insurance company came out to inspect the damage.", "The insurance company insisted that the building be repaired to meet earthquake safety standards.", "The inhabitants paid their premiums after the earthquake.", "The insurance company paid for the earthquake damage."], ans: 3, exp: "Passive implies insurance company paid → Option D." },
        ]
      },

      ex6: {
        label: "Exercise 6 — Multiple Nouns", type: "exercise",
        note: "Think carefully about WHO is doing WHAT to WHOM.",
        qs: [
          { d: [{ s: "(man)", l: "Why is Bill not at work this week?" }, { s: "(woman)", l: "His doctor made him take a week off." }, { s: "(narrator)", l: "What does the woman mean?", q: true }], opts: ["The doctor decided to take some time off from work.", "The doctor told Bill he wasn't too weak to work.", "Bill was mad when the doctor took some time off.", "Bill took a vacation on his doctor's orders."], ans: 3, exp: "'His doctor made HIM take a week off' → Bill took time off because the doctor ordered it. Option D." },
          { d: [{ s: "(man)", l: "Why is Paul going back home this summer?" }, { s: "(woman)", l: "He's returning to Vermont for his sister's wedding." }, { s: "(narrator)", l: "What does the woman mean?", q: true }], opts: ["Paul is getting married this summer.", "Paul's sister is returning from Vermont to get married.", "Paul will be there when his sister gets married this summer.", "Paul's sister is coming to his wedding in Vermont."], ans: 2, exp: "Paul is going TO Vermont for HIS SISTER'S wedding (not his own). Option C." },
          { d: [{ s: "(man)", l: "Did you hear that John's uncle died?" }, { s: "(woman)", l: "Yes, and John was named beneficiary in his uncle's will." }, { s: "(narrator)", l: "What does the woman mean?", q: true }], opts: ["John received an inheritance when his uncle died.", "It's a benefit that John's name is the same as his uncle's.", "John knows that his uncle will come to the benefit.", "John's uncle gave him a beneficial name."], ans: 0, exp: "'Named beneficiary in his uncle's will' = John will inherit money → 'John received an inheritance'. Option A." },
        ]
      },

      toefl_ex6: {
        label: "TOEFL Exercise 6 — Multiple Nouns", type: "toefl",
        note: "Audio-based. Be particularly careful about who is doing what to whom.",
        qs: [
          { d: [], opts: ["The passenger waited at the corner.", "The passenger looked for a taxi at the corner.", "The cab driver waited for the passenger.", "The passenger cornered the waiting taxi driver."], ans: 2, exp: "The cab driver was waiting — 'The cab driver waited for the passenger.'" },
          { d: [], opts: ["It was hard for her to hear Jane last night.", "Jane gave a harp recital last night.", "Jane was playing hard while she was hurt.", "She played the harp last night for Jane."], ans: 1, exp: "Jane performed — 'Jane gave a harp recital last night.' Avoid 'hard/harp' sound trap." },
          { d: [], opts: ["The baby sister went to bed quite early.", "The children were forced to go to bed early.", "The baby-sitter made the bed after the children got up.", "The baby-sitter did not stay up late."], ans: 3, exp: "The baby-sitter didn't stay up very late — Option D." },
          { d: [], opts: ["The man taught his son about football.", "The boy is receiving the ball from his dad.", "The ball is being tossed into the air by the boy.", "The man is playing with the ball in the sun."], ans: 0, exp: "The man (dad) taught his son → Option A." },
          { d: [], opts: ["The students were told to go listen to the speaker.", "The professor attended that evening's lecture.", "The students were given directions to the lecture.", "The professor was directed to the lecture hall."], ans: 0, exp: "Students were directed to attend — 'students were told to go listen to the speaker'." },
          { d: [], opts: ["The manager went to the supply room.", "The clerk set supplies on the floor.", "The clerk went to the supply room at the manager's request.", "The clerk backed into the manager in the supply room."], ans: 2, exp: "Clerk went at manager's request → Option C." },
          { d: [], opts: ["The librarian was quite reserved with the students for two days.", "Within two days the librarian had the books for the students.", "The librarian reserved the books for the students.", "The students put the books on hold for two days."], ans: 2, exp: "The librarian reserved the books → Option C." },
          { d: [], opts: ["The chairman decided that Tony would serve on the board for another year.", "The chairman elected the board.", "The board decided Tony could be chairman after one year.", "Tony became chairman for one more year."], ans: 0, exp: "Chairman decided about Tony → Option A." },
          { d: [], opts: ["The judge defended the murderer.", "The judge tried to protect the defendant from the murderer.", "The judge said that the defendant was a criminal.", "The defense couldn't make a judgment about the criminal."], ans: 2, exp: "Judge made a ruling about the defendant → Option C." },
          { d: [], opts: ["The woman should announce the names of the committee members.", "He is thankful to be appointed to the committee.", "He is sure about the time of the appointment with the committee.", "The woman will serve on the committee."], ans: 1, exp: "He received an appointment — 'thankful to be appointed to the committee'." },
        ]
      },

      ex7: {
        label: "Exercise 7 — Negatives", type: "exercise",
        note: "The best answer uses the OPPOSITE meaning of the negative in the last line.",
        qs: [
          { d: [{ s: "(man)", l: "I can't seem to get the door unlocked." }, { s: "(woman)", l: "That isn't the right key for the door." }, { s: "(narrator)", l: "What does the woman mean?", q: true }], opts: ["The key in the drawer is on the right.", "The man should write the message on the door.", "The man has the wrong key.", "The right key isn't in the drawer."], ans: 2, exp: "'That isn't the right key' = the man HAS THE WRONG KEY. Option C expresses the opposite." },
          { d: [{ s: "(man)", l: "Were you pleased with last week's convention?" }, { s: "(woman)", l: "Nothing went as planned." }, { s: "(narrator)", l: "What does the woman mean?", q: true }], opts: ["The convention was disorganized.", "She didn't plan to attend the convention.", "She planned the convention last week.", "She wasn't pleased with the last week of the convention."], ans: 0, exp: "'Nothing went as planned' = everything was disorganized. Option A." },
          { d: [{ s: "(woman)", l: "Are you planning to go to college next year?" }, { s: "(man)", l: "I'm really unsure about the idea." }, { s: "(narrator)", l: "What does the man mean?", q: true }], opts: ["He definitely wants to go to college.", "He is certain about his plans.", "He's hesitant about attending college.", "His idea is to go to college."], ans: 2, exp: "'Unsure' = hesitant/uncertain → 'He's hesitant about attending college.' Option C." },
        ]
      },

      toefl_ex7: {
        label: "TOEFL Exercise 7 — Negatives", type: "toefl",
        note: "Audio-based. Be particularly careful of negative expressions.",
        qs: [
          { d: [], opts: ["She is very busy.", "She has lots of free time.", "It is not necessary to take out the trash.", "She will do it if she has time."], ans: 0, exp: "Negative expression implies she IS busy → 'She is very busy.'" },
          { d: [], opts: ["The interview is very important.", "He is worried about the interview.", "What he's wearing to the interview is important.", "He is not concerned about the interview."], ans: 3, exp: "Negative implies he doesn't care → 'not concerned about the interview'." },
          { d: [], opts: ["He has almost all the notes.", "His attendance was perfect.", "He went to all the lectures but one.", "He missed more than one psychology class."], ans: 2, exp: "'Almost all' = all but one → 'went to all the lectures but one'." },
          { d: [], opts: ["They passed the library at 6:00.", "The library opens at 6:00 in the summer.", "The library closes at 6:00.", "You can't check out more than six books in the summer."], ans: 2, exp: "Negative implies library NOT open → 'closes at 6:00'." },
          { d: [], opts: ["Water the plants once a day.", "Give the plants no more water.", "Water the plants often while the man is gone.", "Give the plants a limited amount of water."], ans: 3, exp: "Negative implies limiting water → 'give the plants a limited amount of water'." },
          { d: [], opts: ["The service satisfied her.", "The food was worse than the service.", "She thought the service was bad.", "Neither the food nor the service was satisfying."], ans: 3, exp: "'Neither...nor' → both food AND service were unsatisfying. Option D." },
          { d: [], opts: ["He told his kids to leave.", "He seriously wanted the woman to go.", "He was joking when he told the woman to leave.", "He left with the woman."], ans: 2, exp: "Negative/ironic expression = joking → 'joking when he told the woman to leave'." },
          { d: [], opts: ["The project will take all their effort.", "They have no other work to do.", "It's impossible to finish.", "They aren't even close to finishing the project."], ans: 3, exp: "Negative implies far from done → 'aren't even close to finishing'." },
          { d: [], opts: ["She doesn't mind an hour more.", "She'd rather stay more than an hour.", "It's better to stay than go.", "She prefers to leave."], ans: 3, exp: "Negative expression implies she wants to go → 'prefers to leave'." },
          { d: [], opts: ["The service at the hotel wasn't too good.", "This hotel gave excellent service.", "The service at the hotel could have been improved.", "This hotel's service was the same as at other hotels."], ans: 0, exp: "Negative implies bad service → 'service wasn't too good'." },
        ]
      },

      ex8: {
        label: "Exercise 8 — Double Negatives", type: "exercise",
        note: "Two negatives make a positive. NOT + negative expression = positive meaning.",
        qs: [
          { d: [{ s: "(man)", l: "Paula, you worked so hard setting up the field trip." }, { s: "(woman)", l: "I hope no one's unhappy with the arrangements." }, { s: "(narrator)", l: "What does Paula mean?", q: true }], opts: ["She hopes everyone will be pleased.", "She knows no one is happy with what she has done.", "She's arranged to take a trip because she's unhappy.", "Everyone's happy with the condition of the field."], ans: 0, exp: "'No one's unhappy' = everyone IS happy/pleased. Double negative → positive: She hopes everyone will be pleased." },
          { d: [{ s: "(woman)", l: "How was your history exam?" }, { s: "(man)", l: "I didn't study enough, so I didn't do well." }, { s: "(narrator)", l: "What does the man mean?", q: true }], opts: ["He studied a lot and passed.", "He failed in spite of his effort.", "He got a good grade even though he didn't study.", "His grade was poor because of inadequate preparation."], ans: 3, exp: "'Didn't study enough' + 'didn't do well' → poor grade due to lack of preparation. Option D." },
          { d: [{ s: "(man)", l: "Were your friends able to get tickets for the concert?" }, { s: "(woman)", l: "Mark couldn't get tickets for the concert, and neither could Paul." }, { s: "(narrator)", l: "What does the woman mean?", q: true }], opts: ["Although Mark couldn't get both tickets, Paul did.", "Both were unable to obtain tickets.", "Neither Mark nor Paul wanted to go to the concert.", "Mark tried to get tickets, but Paul didn't."], ans: 1, exp: "'Mark couldn't' + 'neither could Paul' → BOTH were unable. Option B." },
        ]
      },

      toefl_ex8: {
        label: "TOEFL Exercise 8 — Double Negatives", type: "toefl",
        note: "Audio-based. Be particularly careful of double negatives.",
        qs: [
          { d: [], opts: ["He'll definitely be elected.", "The election is now complete.", "She has high hopes for his chances.", "It may happen."], ans: 0, exp: "Double negative implies certainty → 'He'll definitely be elected.'" },
          { d: [], opts: ["Both parts of his game were bad.", "He served better than he volleyed.", "Some parts of his game were better than others.", "He played rather well."], ans: 3, exp: "Negative + comparative ('not bad') implies he played well → 'played rather well'." },
          { d: [], opts: ["It is a surprise that he was prepared.", "He was not ready, as usual.", "He prepared a really big surprise.", "His strong preparation came as no surprise."], ans: 3, exp: "Double negative: expected/no surprise → 'His strong preparation came as no surprise.'" },
          { d: [], opts: ["She felt good enough to go out.", "She went out to get some medicine.", "She felt like dancing, so she went out with everyone.", "She stayed home because she was sick."], ans: 3, exp: "Negatives imply she stayed home sick → Option D." },
          { d: [], opts: ["She has problems that others aren't aware of.", "Others aren't aware of her problems.", "She knows she's been a problem.", "She doesn't have a care in the world."], ans: 3, exp: "'Doesn't have a care' = carefree → 'She doesn't have a care in the world.'" },
          { d: [], opts: ["Steve wanted to finish his paper, and so did Paul.", "Both Steve's and Paul's papers were incomplete.", "Steve and Paul were busy doing their term papers.", "When Steve wasn't able to finish his paper, Paul couldn't help."], ans: 1, exp: "Both couldn't finish → 'Both Steve's and Paul's papers were incomplete.'" },
          { d: [], opts: ["It wasn't George's responsibility to pay the bill.", "Bill was irresponsible about paying George's rent.", "George acted carelessly by not taking care of the bill.", "George took responsibility for the unpaid bill."], ans: 3, exp: "Implies George DID take responsibility → Option D." },
          { d: [], opts: ["It's fortunate that he was accepted.", "It's good that he wasn't admitted.", "Fortunately, the university didn't admit him.", "It's too bad he was rejected."], ans: 0, exp: "Double negative → positive: 'It's fortunate that he was accepted.'" },
          { d: [], opts: ["The first essay was better than the second.", "The first and second drafts couldn't be better.", "The second draft of the essay was much better than the first.", "Both versions were poorly written."], ans: 1, exp: "'Couldn't be better' = both excellent → 'The first and second drafts couldn't be better.'" },
          { d: [], opts: ["Roger has been bothered.", "Roger wasn't the least bit disturbed.", "The problems have had little effect on Roger.", "Roger hasn't been disturbed."], ans: 1, exp: "'Not the least bit disturbed' = absolutely NOT bothered → Option B." },
        ]
      },

      toefl_ex9: {
        label: "TOEFL Exercise 9 — Almost Negatives", type: "toefl",
        note: "Audio-based. Careful of 'almost negative' expressions: hardly, barely, scarcely, rarely, seldom.",
        qs: [
          { d: [], opts: ["There's little rain in July.", "In July it never rains.", "It rains hard in July.", "When it rains in July, it rains hard."], ans: 0, exp: "'Hardly any rain' → 'There's little rain in July.' Almost negative = very little." },
          { d: [], opts: ["The university accepted three students.", "None of the students is going to the university.", "John was not accepted.", "Two were not admitted."], ans: 3, exp: "'Hardly any' accepted → only a few, meaning most were not admitted → 'Two were not admitted.'" },
          { d: [], opts: ["Although he did pass, Mark's exam grade wasn't too good.", "Mark failed his history exam.", "The highest grade on the history exam went to Mark.", "Professor Franks didn't pass Mark on the history exam."], ans: 0, exp: "'Barely passed' → 'did pass, but grade wasn't too good.' Almost negative = just barely." },
          { d: [], opts: ["He often has long waits in Dr. Roberts's office.", "He must wait patiently for Robert.", "Dr. Roberts is generally punctual.", "He doesn't mind waiting for Dr. Roberts."], ans: 2, exp: "'Rarely late' → 'Dr. Roberts is generally punctual.' Almost negative = almost always on time." },
          { d: [], opts: ["Betty often takes vacations in winter.", "Betty prefers to take vacations in winter.", "Occasionally Betty works one week during vacation.", "A winter vacation is unusual for Betty."], ans: 3, exp: "'Seldom/rarely' winter vacation → 'A winter vacation is unusual for Betty.'" },
          { d: [], opts: ["He rarely spends time on his courses.", "He's an excellent student.", "He never studies.", "His books are always open."], ans: 1, exp: "'Hardly ever fails' → implies high performance → 'He's an excellent student.'" },
          { d: [], opts: ["He finished the exam in plenty of time.", "He was scared he wouldn't finish.", "He used every possible minute to finish.", "He was unable to complete the exam."], ans: 2, exp: "'Barely finished' → 'He used every possible minute to finish.'" },
          { d: [], opts: ["This was a very long staff meeting.", "This was the only staff meeting in a long time.", "The meeting lasted only until one o'clock.", "The one staff meeting should've lasted longer."], ans: 0, exp: "'Seldom has such a long meeting' → 'This was a very long staff meeting.'" },
          { d: [], opts: ["Meat tastes delicious to him when it's cooked rare.", "He isn't sure if the meal is delicious.", "This meat is the best he's tasted in a long time.", "He'd like to eat some meat from this delicatessen."], ans: 2, exp: "'Hardly ever has such good meat' → 'This meat is the best he's tasted in a long time.'" },
          { d: [], opts: ["He broke his arm trying to move it.", "He only hurt the broken arm.", "He only tries to move the broken arm.", "There's no pain if he rests quietly."], ans: 3, exp: "'Barely any pain' when resting → 'There's no pain if he rests quietly.'" },
        ]
      },

      ex10: {
        label: "Exercise 10 — Negatives + Comparatives", type: "exercise",
        note: "The best answer expresses a SUPERLATIVE or very strong idea. Negative + comparative = superlative.",
        qs: [
          { d: [{ s: "(woman)", l: "Have you gotten over your cold yet?" }, { s: "(man)", l: "I couldn't be feeling any better today." }, { s: "(narrator)", l: "What does the man mean?", q: true }], opts: ["He's feeling terrific.", "He felt a lot worse today.", "He's not feeling too well today.", "He's a bit better today."], ans: 0, exp: "'Couldn't be feeling any better' = feeling as good as possible = TERRIFIC. Negative + comparative = superlative positive." },
          { d: [{ s: "(woman)", l: "What did you think of Mike when you first met him?" }, { s: "(man)", l: "He couldn't have been more unfriendly." }, { s: "(narrator)", l: "What does the man mean?", q: true }], opts: ["Mike was extremely friendly when he met him.", "Mike could have met him sooner.", "Mike didn't seem to like him at all.", "When he met Mike, he didn't have a friend."], ans: 2, exp: "'Couldn't have been more unfriendly' = EXTREMELY UNFRIENDLY = didn't like him at all. Option C." },
          { d: [{ s: "(man)", l: "Did you see Theresa's grade on the math exam? It was unbelievable!" }, { s: "(woman)", l: "No one else could have done better." }, { s: "(narrator)", l: "What does the woman mean?", q: true }], opts: ["Theresa could've gotten a higher grade.", "Anyone could get a good grade.", "Theresa got the highest grade.", "A high grade is impossible for anyone."], ans: 2, exp: "'No one else could have done better' = Theresa did THE BEST = highest grade. Option C." },
        ]
      },

      toefl_ex10: {
        label: "TOEFL Exercise 10 — Negatives + Comparatives", type: "toefl",
        note: "Audio-based. Be particularly careful of comparatives with negatives — they express SUPERLATIVE meanings.",
        qs: [
          { d: [], opts: ["She's not very happy.", "She didn't do very well on the exam.", "She could be somewhat happier.", "She's delighted with the results."], ans: 3, exp: "Negative + comparative → superlative: DELIGHTED → 'She's delighted with the results.'" },
          { d: [], opts: ["Paula is always lazy.", "Paula didn't work very hard this semester.", "Paula made a strong effort.", "Paula could have worked harder."], ans: 2, exp: "'Couldn't have worked harder' = worked as hard as possible → 'Paula made a strong effort.'" },
          { d: [], opts: ["The prices were great!", "The prices were too high.", "She didn't buy much because of the prices.", "The prices could have been lower."], ans: 0, exp: "'Couldn't have been better prices' → 'The prices were great!' Superlative positive." },
          { d: [], opts: ["She is not very smart.", "She always tells him everything.", "He doesn't know her very well.", "She's extremely intelligent."], ans: 3, exp: "'Couldn't be more intelligent' → 'She's extremely intelligent.' Superlative." },
          { d: [], opts: ["The patient absolutely didn't need the surgery.", "The necessity for the surgery was unquestionable.", "The surgeon felt that the operation was necessary.", "It was essential that the surgery be performed immediately."], ans: 3, exp: "'Couldn't have been more necessary' → 'Essential that surgery be performed immediately.'" },
          { d: [], opts: ["They were not very lucky.", "No one was hurt.", "The accident was unfortunate.", "She wanted to have better luck."], ans: 1, exp: "'Couldn't have been luckier' = VERY lucky → 'No one was hurt.'" },
          { d: [], opts: ["Nothing was very difficult.", "The exam wasn't at all easy.", "The exam couldn't have been easier.", "The exam had nothing difficult on it."], ans: 2, exp: "'Couldn't have been easier' = extremely easy → Option C." },
          { d: [], opts: ["She wants that job very much.", "No one is going to get the job.", "Everybody else wants that job as much as she does.", "She is not sure about taking the job."], ans: 0, exp: "'Couldn't want it more' = wants it EXTREMELY → 'She wants that job very much.'" },
          { d: [], opts: ["She was second in the race.", "She was almost the slowest person in the race.", "She won the race.", "She was not faster than anyone else."], ans: 2, exp: "'Couldn't have run faster' = ran as fast as possible = WON → 'She won the race.'" },
          { d: [], opts: ["This math project was extremely complex.", "This math project was less complicated than the last.", "They seldom complete their math projects.", "Complicated math projects are often assigned."], ans: 0, exp: "'Couldn't have been more complex' → 'This math project was extremely complex.'" },
        ]
      },

      toefl_ex_skills7_10: {
        label: "TOEFL Exercise (Skills 7–10)", type: "toefl",
        note: "Audio-based. Combined: negatives, double negatives, almost negatives, and negatives with comparatives.",
        qs: [
          { d: [], opts: ["She can try a little harder.", "There is a lot more that she can do.", "She's doing the best that she can.", "It is impossible for her to do anything."], ans: 2, exp: "'Couldn't do more' → she's already at maximum effort → 'She's doing the best that she can.'" },
          { d: [], opts: ["She's always been late for the bus.", "The bus has always been late.", "The bus only left on time once.", "Only on this trip has the bus been on time."], ans: 3, exp: "'Rarely on time' + this trip being exceptional → 'Only on this trip has the bus been on time.'" },
          { d: [], opts: ["There wasn't enough soup to go around.", "We had so much soup that we couldn't finish it.", "Everyone got one serving of soup, but there wasn't enough for seconds.", "Everyone around the table had a lot of soup."], ans: 2, exp: "'Barely enough' = enough for one serving but not seconds → Option C." },
          { d: [], opts: ["She does want to see the movie.", "It's extremely important to her to go.", "She doesn't want to go there anymore.", "She really couldn't move there."], ans: 2, exp: "Negative implies she no longer wants to go → 'She doesn't want to go there anymore.'" },
          { d: [], opts: ["She handed the paper in on time.", "She was able to complete the paper, but she didn't turn it in.", "The paper was a complete mess, so she didn't turn it in.", "The paper was unfinished."], ans: 3, exp: "'Barely finished' → the paper was unfinished. Option D." },
          { d: [], opts: ["Neither Tim nor Sylvia is taking care of Art.", "Sylvia likes modern art even less than Tim does.", "Sylvia doesn't care for anything Tim does.", "Sylvia and Tim agree in their opinion of modern art."], ans: 3, exp: "Both feel the same way → 'Sylvia and Tim agree in their opinion of modern art.'" },
          { d: [], opts: ["They always work hard in the afternoon.", "They don't do much after lunch.", "After noon they never work.", "It's never hard for them to work in the afternoon."], ans: 1, exp: "'Hardly work after lunch' → 'They don't do much after lunch.'" },
          { d: [], opts: ["It's hard for him to work when it gets warm.", "Whenever it gets warm, he turns on the air-conditioner.", "The air-conditioner only works when it isn't needed.", "He likes to use the air-conditioner when it is warm."], ans: 1, exp: "He uses AC when warm → 'Whenever it gets warm, he turns on the air-conditioner.'" },
        ]
      },

      toefl_ex11: {
        label: "TOEFL Exercise 11 — Agreement", type: "toefl",
        note: "Audio-based. Pay attention to expressions of agreement.",
        qs: [
          { d: [], opts: ["The trip would cost too much.", "She doesn't think that a trip would be a good idea.", "She would like to take two trips rather than one.", "She would also like to take a trip."], ans: 3, exp: "Agreement → she also wants to take a trip. Option D." },
          { d: [], opts: ["He would like to see the elections for town council.", "He agrees that Matt should be elected.", "He thinks the elections should take place next month.", "He disagrees with the woman."], ans: 1, exp: "Agreement → he agrees Matt should be elected. Option B." },
          { d: [], opts: ["She is not sure which course she should take.", "She's not sure if she should take a trip to France.", "She knows that she is not ready for intermediate French.", "She wants to take neither beginning nor intermediate French."], ans: 0, exp: "Agreement + uncertainty → 'She is not sure which course she should take.'" },
          { d: [], opts: ["The man should repeat what he said.", "The man said something foolish.", "She thinks that the food is the best she has ever tasted.", "She agrees that the food is pretty bad."], ans: 3, exp: "Agreement about bad food → 'She agrees that the food is pretty bad.'" },
          { d: [], opts: ["This party hasn't been any fun at all.", "He wonders if the woman enjoyed herself.", "He wants to know what she said.", "He's enjoyed himself tremendously."], ans: 3, exp: "Agreement that party was enjoyable → 'He's enjoyed himself tremendously.'" },
          { d: [], opts: ["She condones what happened.", "She does not like what the man said.", "She agrees with the man about what happened.", "She says that she did not do it."], ans: 2, exp: "Agreement expression → 'She agrees with the man about what happened.'" },
          { d: [], opts: ["He thinks the parties aren't loud.", "He says that the neighbors don't have many parties.", "He agrees that the upstairs neighbors are noisy.", "The loud parties don't bother him."], ans: 2, exp: "Agreement about noisy neighbors → 'He agrees that the upstairs neighbors are noisy.'" },
          { d: [], opts: ["She doesn't like this meal too much.", "This food tastes wonderful to her.", "She's not sure if she likes it.", "She can't stand this meal."], ans: 1, exp: "Agreement that food is good → 'This food tastes wonderful to her.'" },
          { d: [], opts: ["She agrees that getting the car was not a good idea.", "She imagines that she would like to have a similar car.", "She thinks that the man is mistaken about the car.", "She thinks the man has no imagination."], ans: 1, exp: "Agreement about the car → she also wants one like it. Option B." },
          { d: [], opts: ["He would like the woman to repeat what she said.", "He thinks that one semester is enough time for the course.", "He also thinks that the course should be extended.", "He would like to take the course two semesters from now."], ans: 2, exp: "Agreement that course needs more time → 'He also thinks that the course should be extended.'" },
        ]
      },

      ex12: {
        label: "Exercise 12 — Uncertainty & Suggestion", type: "exercise",
        note: "The best answer shows UNCERTAINTY or SUGGESTION.",
        qs: [
          { d: [{ s: "(man)", l: "Do you know what time they're leaving for the city?" }, { s: "(woman)", l: "They have to leave at four o'clock, don't they?" }, { s: "(narrator)", l: "What does the woman mean?", q: true }], opts: ["She's not completely sure when they are leaving.", "They are returning from the city at about 4:00.", "She knows when they are leaving.", "She doesn't have any idea when they are leaving."], ans: 0, exp: "'Don't they?' is a tag question expressing uncertainty → 'She's not completely sure when they are leaving.' Option A." },
          { d: [{ s: "(woman)", l: "I'm so thirsty from all this walking." }, { s: "(man)", l: "Let's stop and get a drink." }, { s: "(narrator)", l: "What does the man suggest?", q: true }], opts: ["They should stop drinking.", "They should go for a walk.", "They should walk thirty miles.", "They should take a break and have a drink."], ans: 3, exp: "'Let's stop and get a drink' = suggestion to take a break and have a drink. Option D." },
          { d: [{ s: "(man)", l: "Is the exam still scheduled for 3:00 on Thursday?" }, { s: "(woman)", l: "As far as I know." }, { s: "(narrator)", l: "What does the woman mean?", q: true }], opts: ["The exam is far away.", "She knows that the exam schedule has been changed.", "She is sure that the exam is set for Thursday.", "She thinks she knows when the test is."], ans: 3, exp: "'As far as I know' = I think so but I'm not 100% certain → 'She thinks she knows when the test is.' Option D." },
        ]
      },

      toefl_ex12: {
        label: "TOEFL Exercise 12 — Uncertainty & Suggestion", type: "toefl",
        note: "Audio-based. Be particularly careful of expressions of uncertainty and suggestion.",
        qs: [
          { d: [], opts: ["He's sure about which chapters they are to read.", "He thinks he knows what the assignment is.", "He has to tell her how far she should go.", "The professor told them to read the chapters after the exam."], ans: 1, exp: "Uncertainty → 'He thinks he knows what the assignment is.' Not fully certain." },
          { d: [], opts: ["The man should take the pie out.", "The man should try something else.", "The man shouldn't try cherry pie.", "The man should feel sorry."], ans: 1, exp: "Suggestion → 'The man should try something else.'" },
          { d: [], opts: ["He knows the movie starts at 8:00.", "He is not quite sure when the movie begins.", "He thinks the start of the movie has been changed.", "He will start the movie himself at 8:00."], ans: 1, exp: "Uncertainty → 'He is not quite sure when the movie begins.'" },
          { d: [], opts: ["Not doing the dishes now", "Leaving the house with the dishes", "Leaving later so that they can do the dishes now", "Washing the dishes before they leave"], ans: 3, exp: "Suggestion to do dishes before leaving → Option D." },
          { d: [], opts: ["She's told Matt he'll go far.", "Matt has far from enough talent.", "She told Matt to roll farther.", "She believes Matt has the ability for the part."], ans: 3, exp: "Expression of belief/confidence → 'She believes Matt has the ability for the part.'" },
          { d: [], opts: ["They should go to the hospital.", "Mary should visit the man.", "The woman should try not to break her leg.", "They should go on a trip with Mary."], ans: 0, exp: "Suggestion regarding injury → 'They should go to the hospital.'" },
          { d: [], opts: ["She knows where the children are.", "The children have finished playing ball.", "She's going to the park to find the children.", "She believes that the children are in the park."], ans: 3, exp: "Uncertainty/belief → 'She believes that the children are in the park.'" },
          { d: [], opts: ["The man should try to borrow some from a neighbor.", "The man should take a check to Tom.", "The man should work on his math assignment with Tom.", "The man should check behind the door."], ans: 1, exp: "Suggestion → 'The man should take a check to Tom.'" },
          { d: [], opts: ["He thinks the bill is due in the middle of the month.", "The bill is approximately fifteen dollars.", "He knows when they should pay the bill.", "The bill is going to be fifteen days late."], ans: 0, exp: "Uncertainty → 'He thinks the bill is due in the middle of the month.'" },

      part_a: {
        label: "★ Part A (Q1–30)", type: "toefl",
        note: "TOEFL Part A — 30 soal percakapan pendek. Pilih jawaban terbaik berdasarkan percakapan yang didengar.",
        qs: [
          { d: [], opts: ["The coffee is much better this morning.", "The coffee tastes extremely good.", "The coffee isn't very good.", "This morning he definitely wants some coffee."], ans: 2, exp: "Ekspresi negatif: kopi tidak enak — Kunci: C." },
          { d: [], opts: ["The two classes meet in an hour and a half.", "The class meets three hours per week.", "Each half of the class is an hour long.", "Two times a week the class meets for an hour."], ans: 1, exp: "Detail jadwal: kelas tiga jam per minggu — Kunci: B." },
          { d: [], opts: ["A few minutes ago, the flight departed.", "The flight will start in a while.", "They are frightened about the departure.", "The plane is going to take off soon."], ans: 3, exp: "Sinonim 'take off soon' = pesawat segera berangkat — Kunci: D." },
          { d: [], opts: ["He hasn't yet begun his project.", "He's supposed to do his science project next week.", "He needs to start working on changing the due date.", "He's been working steadily on his science project."], ans: 0, exp: "Implikasi: belum mulai proyek ilmiahnya — Kunci: A." },
          { d: [], opts: ["At the post office", "In a florist shop", "In a restaurant", "In a hospital delivery room"], ans: 1, exp: "Konteks percakapan mengarah ke toko bunga — Kunci: B." },
          { d: [], opts: ["The professor drowned the cells in a lab.", "The lecture was long and boring.", "The professor divided the lecture into parts.", "The biologist tried to sell the results of the experiment."], ans: 1, exp: "Implikasi: kuliah membosankan — Kunci: B." },
          { d: [], opts: ["She needs to get a driver's license.", "Two pieces of identification are necessary.", "The man should check to see if he needs credit.", "A credit card can be used to get a driver's license."], ans: 1, exp: "Syarat: dua identitas diperlukan — Kunci: B." },
          { d: [], opts: ["Housing within his budget is hard to locate.", "It's hard to find his house in New York.", "He can't afford to move his house to New York.", "Housing in New York is unavailable."], ans: 0, exp: "Sulit menemukan hunian sesuai anggaran — Kunci: A." },
          { d: [], opts: ["The boss was working on the reports.", "He would have to finish the reports before the end of next month.", "He was directed to stay late and finish some work.", "He could finish the reports at home."], ans: 2, exp: "Diperintahkan lembur menyelesaikan pekerjaan — Kunci: C." },
          { d: [], opts: ["The boisterous students made the teacher mad.", "The teacher angered the students with the exam results.", "The students were angry that the teacher was around.", "The angered students complained to the teacher."], ans: 0, exp: "Siswa ribut membuat guru marah — Kunci: A." },
          { d: [], opts: ["The prices are reasonable.", "The store is too far out of town.", "He would like the woman to repeat what she said.", "He agrees with the woman."], ans: 3, exp: "Ekspresi persetujuan — Kunci: D." },
          { d: [], opts: ["It's rained unusually hard this year.", "There hasn't been any rain for many years.", "It's been many years since it rained.", "He doesn't like rain."], ans: 0, exp: "Emphatik: hujan luar biasa deras tahun ini — Kunci: A." },
          { d: [], opts: ["He needs to do a better job writing questions.", "He certainly must make his writing better.", "Without the questions, he cannot write the answers.", "He needs to understand the written questions better."], ans: 1, exp: "Harus memperbaiki tulisannya — Kunci: B." },
          { d: [], opts: ["The agent was standing in line with his passport.", "The line to get new passports is very long.", "The woman must wait her turn to get her passport checked.", "He can check her passport instead of the agent."], ans: 2, exp: "Wanita harus menunggu giliran pemeriksaan paspor — Kunci: C." },
          { d: [], opts: ["He couldn't finish closing the library book.", "He hadn't finished the library assignment, but he was close.", "He was working on the assignment when the library closed.", "His homework was incomplete because the library wasn't open."], ans: 3, exp: "PR tidak selesai karena perpustakaan tutup — Kunci: D." },
          { d: [], opts: ["All the lawyer's preparation did no good.", "The lawyer prepared nothing for the case.", "It wasn't work for the lawyer to prepare for the case.", "The lawyer didn't work to prepare for the case."], ans: 0, exp: "Double negative: persiapan pengacara tidak berguna — Kunci: A." },
          { d: [], opts: ["The history class begins next week.", "He thinks the papers should be turned in next week.", "He has already done the paper for next week.", "The papers are not due next week."], ans: 1, exp: "Menurutnya paper dikumpulkan minggu depan — Kunci: B." },
          { d: [], opts: ["He's not really happy.", "The contractor's work was satisfactory.", "He would rather work with the contractor himself.", "He was already contacted about the work."], ans: 0, exp: "Ekspresi negatif: tidak benar-benar puas — Kunci: A." },
          { d: [], opts: ["The man should try another type of paper.", "The man should locate a typist tomorrow morning.", "The man should make a tape in the morning.", "The man should complete the paper without help."], ans: 3, exp: "Saran: selesaikan paper sendiri — Kunci: D." },
          { d: [], opts: ["She'd like some pie.", "It's easy to buy it.", "The task the man's working on isn't difficult.", "It's easier to prepare pie than do what the man is doing."], ans: 2, exp: "Idiom 'piece of cake' = mudah — Kunci: C." },
          { d: [], opts: ["He reported that the time for the budget meeting had been set.", "He is always late in submitting his accounting figures.", "He never manages to budget his time well.", "He is never too late in turning in his reports."], ans: 1, exp: "Almost negative: selalu terlambat menyerahkan angka — Kunci: B." },
          { d: [], opts: ["The repairs that the mechanic had indicated were already made.", "Betty will follow the instructions later.", "The mechanic extended the repair warranty.", "Betty worked exactly as instructed."], ans: 1, exp: "Perbaikan sudah dilakukan sesuai petunjuk montir — Kunci: B." },
          { d: [], opts: ["Betty wrote the letter as directed.", "The directions were given to Betty in a letter.", "Betty completed the assignment differently.", "Betty worked exactly as instructed."], ans: 3, exp: "Betty bekerja persis sesuai instruksi — Kunci: D." },
          { d: [], opts: ["Walter had a lack of success with his business.", "Walter failed in business.", "Walter's new company is doing rather well.", "Walter hoped to succeed in business."], ans: 2, exp: "Perusahaan baru Walter berjalan cukup baik — Kunci: C." },
          { d: [], opts: ["He should put the organ in the closet.", "The closet has already been organized.", "He needs to rearrange the closet.", "He wishes the closet were closer."], ans: 2, exp: "Bunyi mirip 'organize/closet': perlu menata ulang lemari — Kunci: C." },
          { d: [], opts: ["She didn't do the work.", "She gave the assignment her best effort.", "She finished the assignment even though it was difficult.", "She gave the man a signal."], ans: 0, exp: "Negatif: tidak mengerjakan tugasnya — Kunci: A." },
          { d: [], opts: ["She said some terrible things.", "She didn't say anything nice.", "She didn't have any nice things.", "She said really wonderful things."], ans: 3, exp: "Double negative: mengatakan hal-hal luar biasa — Kunci: D." },
          { d: [], opts: ["New employees are rarely initiated into the company.", "New workers don't generally undertake actions on their own.", "New employees are initially rated.", "It's rare for employees to make new suggestions."], ans: 1, exp: "Almost negative: karyawan baru tidak mengambil inisiatif sendiri — Kunci: B." },
          { d: [], opts: ["The woman is more than a week late.", "The children would have wrecked the house later.", "The woman was so late that she was a wreck.", "He's glad that she was not any later."], ans: 3, exp: "Negatif + komparatif: bersyukur tidak lebih terlambat — Kunci: D." },
          { d: [], opts: ["He had not gone to the store.", "He was still at the market.", "He was going to take care of the shopping.", "He always went to the market."], ans: 0, exp: "Kondisi tidak nyata: tidak pergi ke toko — Kunci: A." },
        ]
      },

        note: "TOEFL Exercise 1 — Fokus pada kalimat TERAKHIR dialog untuk menjawab pertanyaan. Kalimat terakhir biasanya mengandung kunci jawaban.",
        qs: [
          { d: [{ s: "💡 Strategi:", l: "Dengarkan baris terakhir percakapan. Kata-kata di baris terakhir sering mengandung implikasi, idiom, atau ekspresi yang menjadi kunci jawaban." }], opts: ["She has strong ideas about movies.", "She prefers comedies over westerns and romances.", "She doesn't like today's matinee.", "She does not know."], ans: 3, exp: "Baris terakhir wanita: 'I have no idea.' = Dia tidak tahu — Kunci: D." },
          { d: [{ s: "Dialogue:", l: "Was anyone at home at Barb's house? → 'I rang the bell, but no one answered.'" }], opts: ["Barb answered the bell.", "The house was probably empty.", "The bell wasn't in the house.", "The house doesn't have a bell."], ans: 1, exp: "'No one answered' mengimplikasikan rumah kemungkinan kosong — Kunci: B." },
          { d: [{ s: "Dialogue:", l: "How do you think the interview went? → 'I think it's highly unlikely that I got the job.'" }], opts: ["It's unlikely that he'll go to the interview.", "He thinks he'll be recommended for a high-level job.", "The interview was apparently quite unsuccessful.", "He had an excellent interview."], ans: 2, exp: "'Highly unlikely that I got the job' = wawancara tampaknya tidak berhasil — Kunci: C." },
          { d: [], opts: ["He is leaving now.", "He has to go out of his way.", "He will not be leaving soon.", "He will do it his own way."], ans: 0, exp: "Baris terakhir mengindikasikan dia akan segera pergi — Kunci: A." },
          { d: [], opts: ["He locked the door.", "He tried unsuccessfully to get into the house.", "He was able to open the door.", "He left the house without locking the door."], ans: 2, exp: "Implikasi dari baris terakhir: dia berhasil membuka pintu — Kunci: C." },
          { d: [], opts: ["She doesn't like to listen to turkeys.", "She thinks the dinner sounds special.", "She especially likes the roast turkey.", "She'd prefer a different dinner."], ans: 3, exp: "Nada baris terakhir mengindikasikan preferensi untuk makan malam yang berbeda — Kunci: D." },
          { d: [], opts: ["He'll be busy with her homework tonight.", "He can't help her tonight.", "He's sorry he can't ever help her.", "He'll help her with her physics."], ans: 1, exp: "Baris terakhir menyiratkan dia tidak bisa membantu malam ini — Kunci: B." },
          { d: [], opts: ["Her eyes hurt.", "She thought the lecture was great.", "The class was boring.", "She didn't want to watch Professor Martin."], ans: 2, exp: "Implikasi baris terakhir: kuliah membosankan — Kunci: C." },
          { d: [], opts: ["Not all the bills have been paid.", "They don't have enough credit to pay the bills.", "What she said on the phone was not credible.", "He used a credit card to pay some of the bills."], ans: 0, exp: "Baris terakhir mengindikasikan belum semua tagihan dibayar — Kunci: A." },
          { d: [], opts: ["She'll call back quickly.", "She'll definitely be back by 4:00.", "She'll give it back by 4:00.", "She'll try to return fast."], ans: 3, exp: "'Try to return fast' = mencoba kembali dengan cepat — Kunci: D." },
          { d: [], opts: ["She hasn't seen Tim.", "Tim was there only for a moment.", "Tim was around a short time ago.", "Tim will return in a minute."], ans: 2, exp: "Baris terakhir: Tim ada di sini baru saja — Kunci: C." },
          { d: [], opts: ["She doesn't like the place he chose.", "She doesn't want to get into the car.", "She's glad the spot is reserved.", "They can't park the car there."], ans: 3, exp: "Implikasi: tidak bisa parkir di sana — Kunci: D." },
          { d: [], opts: ["There's plenty to eat.", "The refrigerator's broken.", "The food isn't in the refrigerator.", "He's not sure if there's enough food."], ans: 0, exp: "Baris terakhir mengindikasikan makanan cukup tersedia — Kunci: A." },
        ]
      },

    };

    const KEYS = ['part_a', 'part_b', 'part_c', 'ex1_focus', 'ex2', 'toefl_ex2', 'ex3', 'toefl_ex3', 'ex4', 'toefl_ex4', 'toefl_ex5', 'ex6', 'toefl_ex6', 'ex7', 'toefl_ex7', 'ex8', 'toefl_ex8', 'toefl_ex9', 'ex10', 'toefl_ex10', 'toefl_ex_skills7_10', 'toefl_ex11', 'ex12', 'toefl_ex12', 'toefl_ex_skills1_3', 'toefl_ex_skills4_6', 'toefl_rev_1_6', 'toefl_rev_1_10', 'ex13', 'toefl_ex13', 'toefl_ex_skills11_13', 'toefl_rev_1_13', 'ex14', 'toefl_ex14', 'ex15_untrue', 'toefl_ex15', 'toefl_ex_skills14_revised', 'toefl_rev_1_15', 'ex16_dialogue', 'ex17_idioms', 'toefl_ex17', 'toefl_ex16', 'toefl_ex_skills16_17', 'toefl_rev_1_17', 'ex18', 'ex19', 'toefl_ex_skills18_22', 'ex23', 'ex24', 'toefl_rev_skills23_27', 'toefl_ex22_long', 'toefl_ex27'];
    let state = { section: 'part_a', idx: 0, answers: {}, mode: 'quiz' };

    function render() {
      const root = document.getElementById('root');
      const sec = DATA[state.section];
      const qs = sec.qs;
      const total = qs.length;
      const answered = Object.keys(state.answers).length;
      const correct = Object.values(state.answers).filter(a => a.correct).length;
      const testTabs = ['part_a', 'part_b', 'part_c', 'ex1_focus'];
      const isTestTab = testTabs.includes(state.section);
      const bc = sec.type === 'exercise' ? 'badge-ex' : isTestTab ? 'badge-parta' : sec.type === 'toefl' ? 'badge-toefl' : 'badge-rev';
      const bl = sec.type === 'exercise' ? 'Exercise' : isTestTab ? '★ TOEFL Test' : sec.type === 'toefl' ? 'TOEFL Exercise' : 'TOEFL Review';

      let h = `<div class="header"><h1>Longman TOEFL — Listening: Short Dialogues</h1><p>Section One: Listening (Paper and Computer)</p></div>`;
      h += `<div class="tabs-wrap"><div class="tabs">`;
      KEYS.forEach(k => {
        const isTest = testTabs.includes(k);
        const activeClass = state.section === k ? ' active' : '';
        const testClass = isTest ? ' part-a' : '';
        h += `<button class="tab${activeClass}${testClass}" onclick="chg('${k}')">${DATA[k].label}</button>`;
      });
      h += `</div></div>`;
      h += `<div class="progress-bar"><div class="progress-fill" style="width:${total ? Math.round(answered / total * 100) : 0}%"></div></div>`;
      h += `<div class="stats"><div class="stat"><div class="stat-num">${total}</div><div class="stat-lbl">Total</div></div><div class="stat"><div class="stat-num">${answered}</div><div class="stat-lbl">Answered</div></div><div class="stat"><div class="stat-num" style="color:#1a7a4a">${correct}</div><div class="stat-lbl">Correct</div></div><div class="stat"><div class="stat-num" style="color:#b91c1c">${answered - correct}</div><div class="stat-lbl">Wrong</div></div></div>`;

      if (state.mode === 'result') {
        const pct = answered > 0 ? Math.round(correct / answered * 100) : 0;
        h += `<div class="score-screen"><div class="score-big">${pct}%</div><div class="score-label">${correct} of ${answered} correct — ${sec.label}</div><div class="score-grid"><div class="stat"><div class="stat-num" style="color:#1a7a4a">${correct}</div><div class="stat-lbl">Correct</div></div><div class="stat"><div class="stat-num" style="color:#b91c1c">${answered - correct}</div><div class="stat-lbl">Wrong</div></div><div class="stat"><div class="stat-num">${total - answered}</div><div class="stat-lbl">Skipped</div></div></div><button class="nav-btn primary" onclick="rst()">Try Again</button> <button class="nav-btn" onclick="rev()">Review</button></div>`;
        root.innerHTML = h; return;
      }

      const q = qs[state.idx];
      const ua = state.answers[state.idx];
      const done = ua !== undefined;

      h += `<div class="card"><div class="q-meta"><span class="badge ${bc}">${bl}</span><span>${sec.label}</span><span>Q${state.idx + 1} / ${total}</span></div>`;
      const noteClass = isTestTab ? 'note note-parta' : 'note';
      if (sec.note) h += `<div class="${noteClass}">${sec.note}</div>`;

      if (q.d && q.d.length > 0) {
        h += `<div class="dialogue">`;
        q.d.forEach(line => {
          if (line.q) { h += `<div class="narrator-line">${line.s} ${line.l}</div>`; }
          else { h += `<div><span class="speaker">${line.s}</span><span class="line">${line.l}</span></div>`; }
        });
        h += `</div>`;
      } else {
        const audioMsg = isTestTab
          ? '🎧 Dengarkan percakapan dari audio — pilih jawaban terbaik berdasarkan apa yang diucapkan.'
          : '🎧 Audio-based question — select the best answer for this dialogue type.';
        h += `<div class="audio-note">${audioMsg}</div>`;
      }

      h += `<div class="options">`;
      q.opts.forEach((opt, i) => {
        let cls = 'opt' + (done ? ' disabled' : '');
        if (done) { if (i === q.ans) cls += ' correct'; else if (i === ua.idx && ua.idx !== q.ans) cls += ' wrong'; }
        h += `<div class="${cls}" onclick="${done ? '' : 'sel(' + i + ')'}">`
          + `<span class="opt-label">${String.fromCharCode(65 + i)}.</span><span>${opt}</span></div>`;
      });
      h += `</div>`;
      if (done) { const ok = ua.idx === q.ans; h += `<div class="explanation"><strong>${ok ? '✓ Correct!' : '✗ Incorrect.'}</strong> ${q.exp}</div>`; }
      h += `</div>`;
      h += `<div class="nav"><button class="nav-btn" onclick="prv()" ${state.idx === 0 ? 'disabled' : ''}>← Prev</button><span class="q-counter">${state.idx + 1} / ${total}</span>`;
      if (state.idx < total - 1) h += `<button class="nav-btn primary" onclick="nxt()">Next →</button>`;
      else h += `<button class="nav-btn primary" onclick="showR()">See Results</button>`;
      h += `</div>`;
      root.innerHTML = h;
    }

    function sel(i) { const q = DATA[state.section].qs[state.idx]; state.answers[state.idx] = { idx: i, correct: i === q.ans }; render(); }
    function nxt() { if (state.idx < DATA[state.section].qs.length - 1) { state.idx++; render(); } }
    function prv() { if (state.idx > 0) { state.idx--; render(); } }
    function chg(k) { state.section = k; state.idx = 0; state.answers = {}; state.mode = 'quiz'; render(); }
    function showR() { state.mode = 'result'; render(); }
    function rst() { state.idx = 0; state.answers = {}; state.mode = 'quiz'; render(); }
    function rev() { state.idx = 0; state.mode = 'quiz'; render(); }
    render();
  </script>
</body>

</html>
