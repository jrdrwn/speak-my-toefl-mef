      ex22: {
        label: "Ex 22 — S/V Agreement (Inverted Verbs)", type: "ci", skill: "Skill 22",
        note: "Setelah INVERSION (question words, negatives, place, conditionals, comparisons), V tetap sepakat dengan S yang mungkin ada SETELAH V.",
        tip: "'Seldom have THE STUDENTS...' — V = 'have' sepakat dengan 'students' (jamak), bukan kata yang menyebabkan inversion.",
        qs: [
          { s: "Only once this morning were the letters delivered by the campus mail service.", ans: "C", exp: "S = 'letters' (jamak); V = 'were.' Benar." },
          { s: "Around the corner and to the right is the rooms that have been assigned to that program.", ans: "I", exp: "S = 'the rooms' (jamak) → V harus 'are,' bukan 'is.'" },
          { s: "What in the world is the children trying to do?", ans: "I", exp: "S = 'the children' (jamak) → V harus 'are,' bukan 'is.'" },
          { s: "John would be studying the chapters were he able to get hold of the book.", ans: "C", exp: "Conditional inverted: S = 'he' (tunggal); V = 'were.' Benar." },
          { s: "This chapter has many more exercises than do the next one.", ans: "I", exp: "S = 'the next one' (tunggal) → V harus 'does,' bukan 'do.'" },
          { s: "The computer programmer was unaware that there was so many mistakes in the program he had written.", ans: "I", exp: "S = 'mistakes' (jamak) → 'were so many mistakes,' bukan 'was so many.'" },
          { s: "Seldom in the history of television has two new comedies been so successful in one season.", ans: "I", exp: "S = 'two new comedies' (jamak) → 'have...been,' bukan 'has.'" },
          { s: "How many huge mistakes have the teacher actually found in the research paper?", ans: "I", exp: "S = 'the teacher' (tunggal) → 'has the teacher found,' bukan 'have.'" },
          { s: "The new phone system is able to hold far more messages than was the phone system that had previously been used.", ans: "C", exp: "S = 'the phone system' (tunggal); V = 'was.' Benar." },
          { s: "In the parking lot south of the stadium was the cars that were about to be towed.", ans: "I", exp: "S = 'the cars' (jamak) → 'were the cars,' bukan 'was the cars.'" }
        ]
      },

      ex23: {
        label: "Ex 23 — S/V Agreement (Singular Words)", type: "ci", skill: "Skill 23",
        note: "Kata-kata berikut selalu TUNGGAL meski berkonotasi jamak: everybody, anyone, someone, nobody, each, every, anything, nothing, everything.",
        tip: "'Everyone IS here.' 'Each of the students HAS...' 'Somebody NEEDS help.' — selalu singular!",
        qs: [
          { s: "It is impossible to believe that somebody actually admire that man.", ans: "I", exp: "'somebody' = tunggal → 'admires,' bukan 'admire.'" },
          { s: "Each of the doctors in the building needs to have a separate reception area.", ans: "C", exp: "'Each' = tunggal → 'needs.' Benar." },
          { s: "The president felt that no one were better suited for the position of chief staff advisor.", ans: "I", exp: "'no one' = tunggal → 'was better suited,' bukan 'were.'" },
          { s: "Everybody participating in the fund-raiser are to turn in the tickets by 8:00.", ans: "I", exp: "'Everybody' = tunggal → 'is to turn in,' bukan 'are.'" },
          { s: "Because of the low number of orders, nothing has to be done now.", ans: "C", exp: "'nothing' = tunggal → 'has.' Benar." },
          { s: "Every time someone take unnecessary breaks, precious moments of production time are lost.", ans: "I", exp: "'someone' = tunggal → 'takes,' bukan 'take.'" },
          { s: "Anybody who goes to the top of the Empire State Building is impressed with the view.", ans: "C", exp: "'Anybody' = tunggal → 'goes' dan 'is.' Benar." },
          { s: "Every man, woman, and child in this line are required to sign the forms in order to complete the registration process.", ans: "I", exp: "'Every...man, woman, and child' = tunggal (Every + noun) → 'is required.'" },
          { s: "It is nice to believe that anything is possible if a person tries hard enough.", ans: "C", exp: "'anything' = tunggal → 'is.' Benar." },
          { s: "The company reiterated to reporters that nobody have been dismissed because of the incident.", ans: "I", exp: "'nobody' = tunggal → 'has been dismissed,' bukan 'have.'" }
        ]
      },

      ex24: {
        label: "Ex 24 — Parallel Structure (Coordinate Conjunctions)", type: "ci", skill: "Skill 24",
        note: "Dengan AND, BUT, OR → kedua sisi harus dalam bentuk GRAMATIKAL YANG SAMA (noun+noun, verb+verb, phrase+phrase, dll.).",
        tip: "'She likes swimming AND to run.' ← salah. Harusnya: 'swimming AND running' ATAU 'to swim AND to run.'",
        qs: [
          { s: "She held jobs as a typist, a housekeeper, and in a restaurant.", ans: "I", exp: "TIDAK PARALLEL: 'typist, housekeeper, [in a restaurant].' 'In a restaurant' bukan noun. Harusnya: 'a typist, a housekeeper, and a server.'" },
          { s: "The report you are looking for could be in the file or on the desk.", ans: "C", exp: "PARALLEL: 'in the file' or 'on the desk' — dua frasa preposisi. Benar." },
          { s: "She works very hard but usually gets below-average grades.", ans: "C", exp: "PARALLEL: '[She] works' but '[She] gets' — dua verba frase. Benar." },
          { s: "The speaker introduced himself, told several interesting anecdotes, and finishing with an emotional plea.", ans: "I", exp: "TIDAK PARALLEL: 'introduced, told, and finishing.' Harusnya: 'introduced, told, and finished.'" },
          { s: "You should know when the program starts and how many units you must complete.", ans: "C", exp: "PARALLEL: dua noun clauses ('when...' and 'how many...'). Benar." },
          { s: "The term paper he wrote was rather short but very impressive.", ans: "C", exp: "PARALLEL: 'short' but 'impressive' — dua adjective. Benar." },
          { s: "She suggested taking the plane this evening or that we go by train tomorrow.", ans: "I", exp: "TIDAK PARALLEL: 'taking the plane' (gerund) or 'that we go' (clause). Harusnya: 'taking the plane...or taking the train.'" },
          { s: "The dean or the assistant dean will inform you of when and where you should apply for your diploma.", ans: "C", exp: "PARALLEL: 'when' and 'where' — dua kata tanya. Benar." },
          { s: "There are papers to file, reports to type, and those letters should be answered.", ans: "I", exp: "TIDAK PARALLEL: 'papers to file, reports to type, and [those letters should be answered].' Harusnya: 'letters to answer.'" },
          { s: "The manager needed a quick but thorough response.", ans: "C", exp: "PARALLEL: 'quick' but 'thorough' — dua adjective. Benar." }
        ]
      },

      ex25: {
        label: "Ex 25 — Parallel Structure (Paired Conjunctions)", type: "ci", skill: "Skill 25",
        note: "PAIRED CONJUNCTIONS: both...and / either...or / neither...nor / not only...but also. Kedua sisi harus PARALLEL.",
        tip: "'both A and B' — A dan B harus bentuk gramatikal yang sama. 'either...or,' 'neither...nor,' 'not only...but also' — sama.",
        qs: [
          { s: "According to the syllabus, you can either write a paper or you can take an exam.", ans: "I", exp: "TIDAK PARALLEL: 'either write a paper' (VP) or 'you can take' (S+V). Hapus 'you can': 'either write a paper or take an exam.'" },
          { s: "It would be both noticed and appreciated if you could finish the work before you leave.", ans: "C", exp: "PARALLEL: 'both noticed and appreciated' — dua past participle. Benar." },
          { s: "She would like neither to see a movie or to go bowling.", ans: "I", exp: "WRONG PAIR: 'neither...or' salah. Harusnya: 'neither...nor': 'neither to see a movie nor to go bowling.'" },
          { s: "Either the manager or her assistant can help you with your refund.", ans: "C", exp: "PARALLEL: 'Either [the manager] or [her assistant]' — dua noun phrase. Benar." },
          { s: "She wants not only to take a trip to Europe but she also would like to travel to Asia.", ans: "I", exp: "TIDAK PARALLEL: 'not only to take a trip' (infinitive) but 'she also would like to travel' (S+V). Harusnya: 'not only to take a trip...but also to travel to Asia.'" },
          { s: "He could correct neither what you said nor you wrote.", ans: "I", exp: "TIDAK PARALLEL: 'neither what you said' (noun clause) nor 'you wrote' (S+V). Harusnya: 'neither what you said nor what you wrote.'" },
          { s: "Both the tailor or the laundress could fix the damage to the dress.", ans: "I", exp: "WRONG PAIR: 'both...or' salah. Harusnya: 'both...and': 'Both the tailor and the laundress.'" },
          { s: "He not only called the police department but also called the fire department.", ans: "C", exp: "PARALLEL: 'not only called...but also called' — dua verba. Benar." },
          { s: "You can graduate either at the end of the fall semester or you can graduate at the end of the spring semester.", ans: "I", exp: "TIDAK PARALLEL — 'you can graduate' diulang. Harusnya: 'either at the end of the fall semester or at the end of the spring semester.'" },
          { s: "The movie was neither amusing nor was it interesting.", ans: "I", exp: "TIDAK PARALLEL: 'neither amusing' (adjective) nor 'was it interesting' (S+V). Hapus 'was it': 'neither amusing nor interesting.'" }
        ]
      }

    };

    // ─── KEYS ────────────────────────────────────────────────────────────────────
    const KEYS_STRUCT = ['pretest_struct', 'ex1', 'ex2', 'ex3', 'ex4', 'ex5', 'ex6', 'ex7', 'ex8', 'ex9', 'ex10'];
    const KEYS_WE = ['pretest_we', 'ex11', 'ex12', 'ex13', 'ex14', 'ex15', 'ex16', 'ex17', 'ex18', 'ex19', 'ex20', 'ex21', 'ex22', 'ex23', 'ex24', 'ex25'];
    const ALL_KEYS = [...KEYS_STRUCT, ...KEYS_WE];

    // ─── STATE ───────────────────────────────────────────────────────────────────
    let state = { section: 'pretest_struct', idx: 0, answers: {}, mode: 'quiz' };

    // ─── HELPERS ─────────────────────────────────────────────────────────────────
    function sec() { return DATA[state.section]; }
    function total() { return sec().qs.length; }
    function answered() {
      const k = state.section;
      return sec().qs.filter((_, i) => state.answers[k + '-' + i] !== undefined).length;
    }
    function correct() {
      const k = state.section; const s = sec();
      return s.qs.filter((q, i) => {
        const a = state.answers[k + '-' + i];
        if (a === undefined) return false;
        if (s.type === 'ci') return a === q.ans;
        return a === q.ans;
      }).length;
    }
    function getType() { return sec().type; }
    function progressClass() {
      const t = getType();
      if (t === 'struct') return 'struct';
      if (t === 'written') return 'written';
      return 'test';
    }
    function badgeClass() {
      const t = getType();
      if (t === 'struct') return 'badge-struct';
      if (t === 'written') return 'badge-written';
      return 'badge-test';
    }
    function badgeLabel() {
      const t = getType();
      if (t === 'struct') return 'Structure';
      if (t === 'written') return 'Written Expression';
      return 'Pre-Test';
    }
    function noteClass() {
      const t = getType();
      if (t === 'struct') return 'note-struct';
      if (t === 'written') return 'note-written';
      return 'note-test';
    }

    // ─── RENDER ──────────────────────────────────────────────────────────────────
    function render() {
      const root = document.getElementById('root');
      const s = sec();
      const tot = total();
      const ans = answered();
      const cor = correct();
      const qIdx = state.idx;
      const secKey = state.section;
      const aKey = secKey + '-' + qIdx;
      const ua = state.answers[aKey];
      const done = ua !== undefined;
      const q = s.qs[qIdx];

      // Header
      let h = `<div class="header">
    <h1>Longman TOEFL — Structure &amp; Written Expression</h1>
    <p>Section Two: Structure and Written Expression</p>
  </div>`;

      // Tabs — two rows
      h += `<div class="tabs-wrap"><div class="tabs">`;
      ALL_KEYS.forEach(k => {
        const d = DATA[k];
        const isTest = k.startsWith('pretest');
        const isWe = d.type === 'written';
        let cls = `tab${state.section === k ? ' active' : ''}`;
        if (isTest) cls += ' test-tab';
        else if (isWe) cls += ' we-tab';
        h += `<button class="${cls}" onclick="chg('${k}')">${d.label}</button>`;
      });
      h += `</div></div>`;

      // Progress
      h += `<div class="progress-bar"><div class="progress-fill ${progressClass()}" style="width:${tot ? Math.round(ans / tot * 100) : 0}%"></div></div>`;

      // Stats
      h += `<div class="stats">
    <div class="stat"><div class="stat-num">${tot}</div><div class="stat-lbl">Total</div></div>
    <div class="stat"><div class="stat-num">${ans}</div><div class="stat-lbl">Answered</div></div>
    <div class="stat"><div class="stat-num" style="color:#059669">${cor}</div><div class="stat-lbl">Correct</div></div>
    <div class="stat"><div class="stat-num" style="color:#dc2626">${ans - cor}</div><div class="stat-lbl">Wrong</div></div>
  </div>`;

      // Score screen
      if (state.mode === 'result') {
        const pct = ans > 0 ? Math.round(cor / ans * 100) : 0;
        const sc = progressClass();
        h += `<div class="score-screen">
      <div class="score-big score-${sc}">${pct}%</div>
      <div class="score-label">${cor} of ${ans} correct — ${s.label}</div>
      <div class="score-grid">
        <div class="stat"><div class="stat-num" style="color:#059669">${cor}</div><div class="stat-lbl">Correct</div></div>
        <div class="stat"><div class="stat-num" style="color:#dc2626">${ans - cor}</div><div class="stat-lbl">Wrong</div></div>
        <div class="stat"><div class="stat-num">${tot - ans}</div><div class="stat-lbl">Skipped</div></div>
      </div>
      <button class="nav-btn" style="background:#059669;color:#fff;border-color:#059669" onclick="rst()">Try Again</button>
      <button class="nav-btn" style="margin-left:8px" onclick="rev()">Review Answers</button>
    </div>`;
        root.innerHTML = h; return;
      }

      // Note + tip
      h += `<div class="note ${noteClass()}">${s.note}</div>`;
      if (s.tip) h += `<div class="tip-box">💡 <strong>Tips:</strong> ${s.tip}</div>`;

      // ── CARD ──
      h += `<div class="card">`;
      h += `<div class="q-meta">
    <span class="badge ${badgeClass()}">${badgeLabel()}</span>
    <span class="skill-tag">${s.skill || s.label}</span>
    <span>Q${qIdx + 1} / ${tot}</span>
  </div>`;

      // ─ STRUCTURE (MCQ with blank) ─
      if (s.type === 'struct') {
        h += `<div class="sentence-box">${q.s.replace('___', '<span class="blank">' + (done ? q.opts[q.ans] : '&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;') + '</span>')}</div>`;
        h += `<div class="options">`;
        q.opts.forEach((opt, i) => {
          let cls = 'opt' + (done ? ' disabled' : '');
          if (done) {
            if (i === q.ans) cls += ' correct';
            else if (ua === i && i !== q.ans) cls += ' wrong';
          }
          h += `<div class="${cls}" onclick="${done ? '' : 'selMCQ(' + i + ')'}">
        <span class="opt-label">(${String.fromCharCode(65 + i)})</span><span>${opt}</span>
      </div>`;
        });
        h += `</div>`;
        if (done) {
          const ok = ua === q.ans;
          h += `<div class="explanation"><strong>${ok ? '✓ Correct!' : '✗ Incorrect.'}</strong> ${q.exp}</div>`;
        }
      }

      // ─ WRITTEN EXPRESSION (error identification) ─
      else if (s.type === 'written') {
        // Build sentence with clickable parts A B C D
        const labels = ['A', 'B', 'C', 'D'];
        h += `<div class="we-sentence">`;
        // Split sentence by | markers
        const raw = q.s;
        const parts = q.parts;
        // Reconstruct sentence with underlined parts
        let sHtml = raw;
        // Replace |A|text|, |B|text|, etc. pattern
        parts.forEach((part, i) => {
          if (!part) return;
          let cls = 'we-part';
          if (done) {
            if (i === q.ans) cls += ua === i ? ' correct-sel' : ' correct-reveal';
            else if (ua === i) cls += ' wrong-sel';
          } else {
            if (ua === i) cls += ' selected';
          }
          const onclick = done ? '' : `onclick="selWE(${i})"`;
        });
        // Rebuild display manually
        h += buildWESentence(q, done, ua);
        h += `</div>`;
        // Letter buttons
        h += `<div class="ci-choices">`;
        parts.forEach((part, i) => {
          if (!part) return;
          let cls = 'ci-btn';
          if (done) {
            if (i === q.ans) cls += ua === i ? ' correct' : ' reveal-correct';
            else if (ua === i) cls += ' wrong';
          }
          h += `<button class="${cls}"${done ? '' : ` onclick="selWE(${i})"`}>(${String.fromCharCode(65 + i)})</button>`;
        });
        h += `</div>`;
        if (done) {
          const ok = ua === q.ans;
          h += `<div class="explanation we"><strong>${ok ? '✓ Correct!' : '✗ Incorrect.'}</strong>
        Jawaban yang salah: <strong>(${String.fromCharCode(65 + q.ans)}) "${q.parts[q.ans]}"</strong>
        → seharusnya <span class="correction-tag">${q.fix}</span><br><br>${q.exp}
      </div>`;
        }
      }

      // ─ C/I EXERCISE ─
      else if (s.type === 'ci') {
        h += `<div class="ci-sentence">${q.s}</div>`;
        h += `<div class="ci-choices">`;
        ['C', 'I'].forEach(choice => {
          let cls = 'ci-btn';
          if (done) {
            if (choice === q.ans) cls += ua === choice ? ' correct' : ' reveal-correct';
            else if (ua === choice) cls += ' wrong';
          }
          h += `<button class="${cls}"${done ? '' : ` onclick="selCI('${choice}')"`}>${choice === 'C' ? '✓ Correct' : '✗ Incorrect'}</button>`;
        });
        h += `</div>`;
        if (done) {
          const ok = ua === q.ans;
          h += `<div class="explanation"><strong>${ok ? '✓ Benar!' : '✗ Kurang tepat.'}</strong> ${q.exp}</div>`;
        }
      }

      // Nav
      const isLast = qIdx >= tot - 1;
      h += `<div class="nav">
    <button class="nav-btn" onclick="prev()" ${qIdx === 0 ? 'disabled' : ''}>← Prev</button>
    <span class="q-counter">Q${qIdx + 1} / ${tot} · ${ans} answered</span>
    ${isLast
          ? `<button class="nav-btn test-primary" onclick="showR()">Results →</button>`
          : `<button class="nav-btn primary" onclick="next()">Next →</button>`
        }
  </div>`;
      h += `</div>`; // end card
      root.innerHTML = h;
    }

    function buildWESentence(q, done, ua) {
      // We'll highlight parts inline in the sentence
      const raw = q.s;
      const parts = q.parts;
      let out = '';
      // The sentence already has | delimiters for parts
      // Format: text |A|underlinedA|B| text |B|underlinedB... 
      // But actually we stored full sentence and separate parts array
      // Let's just show the full sentence text cleanly with underlined spans below
      // Show sentence first
      let cleanSentence = raw.replace(/\|[A-D]\|/g, '').trim();
      out += `<span style="font-size:14px;line-height:2">${cleanSentence}</span><br><br>`;
      out += `<span style="font-size:12px;color:#666;">Underlined parts:</span><br>`;
      const labels = ['A', 'B', 'C', 'D'];
      parts.forEach((part, i) => {
        if (!part) return;
        let style = 'display:inline-block;border-bottom:2px solid ';
        let color = '#1a56a8';
        if (done) {
          if (i === q.ans) color = ua === i ? '#059669' : '#059669';
          else if (ua === i) color = '#dc2626';
        }
        style += color + ';margin-right:16px;padding:1px 3px;font-size:13px;cursor:' + (done ? 'default' : 'pointer');
        out += `<span style="${style}" ${done ? '' : ('onclick="selWE(' + i + ')"')}>
      <span style="font-size:10px;font-weight:700;color:${color};vertical-align:super">(${labels[i]})</span>
      ${part}
    </span>`;
      });
      return out;
    }

    // ─── ACTIONS ─────────────────────────────────────────────────────────────────
    function selMCQ(i) { state.answers[state.section + '-' + state.idx] = i; render(); }
    function selCI(c) { state.answers[state.section + '-' + state.idx] = c; render(); }
    function selWE(i) { state.answers[state.section + '-' + state.idx] = i; render(); }
    function next() { state.idx++; render(); }
    function prev() { if (state.idx > 0) { state.idx--; render(); } }
    function chg(k) { state.section = k; state.idx = 0; state.answers = {}; state.mode = 'quiz'; render(); }
    function showR() { state.mode = 'result'; render(); }
    function rst() { state.idx = 0; state.answers = {}; state.mode = 'quiz'; render(); }
    function rev() { state.idx = 0; state.mode = 'quiz'; render(); }

    render();
  </script>
</body>

</html>
