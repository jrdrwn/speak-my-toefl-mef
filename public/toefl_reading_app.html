{q:"Which of the following would be the BEST TITLE for this passage?",opts:["The Massive Concrete Vault","Fort Knox Security","Where the United States Keeps Its Gold","A Visit to Kentucky"],ans:2,exp:"Judul terbaik menangkap inti keseluruhan passage: 'Where the United States Keeps Its Gold.'"}
]},
{title:"Mohs' Hardness Scale",text:"One identifying characteristic of minerals is their relative hardness, which can be determined by scratching one mineral with another. In this type of test, a harder mineral can scratch a softer one, but a softer mineral is unable to scratch the harder one. The Mohs' hardness scale is used to rank minerals according to hardness. Ten minerals are listed in this scale, ranging from talc with a hardness of 1 to diamond with a hardness of 10. On this scale, quartz (number 7) is harder than feldspar (number 6) and is therefore able to scratch it; however, feldspar is unable to make a mark on quartz.",
qs:[
{q:"Which of the following best states the SUBJECT of this passage?",opts:["The hardness of diamonds","Identifying minerals by means of a scratch test","Feldspar on the Mohs' scale","Recognizing minerals in their natural state"],ans:1,exp:"Subjek utama adalah identifikasi mineral melalui uji goresan (scratch test)."},
{q:"The MAIN IDEA of this passage is that",opts:["the hardness of a mineral can be determined by its ability to make a mark on other minerals","diamonds, with a hardness of 10, can scratch all other minerals","a softer mineral cannot be scratched by a harder mineral","talc is the first mineral listed on the Mohs' scale"],ans:0,exp:"Ide pokok: kekerasan mineral diukur dari kemampuannya menggores mineral lain."}
]},
{title:"Hurricanes in the North Atlantic",text:"Hurricanes generally occur in the North Atlantic from May through November, with the peak of the hurricane season in September; only rarely will they occur from December through April in that part of the ocean. The main reason for the occurrence of hurricanes during this period is that the temperature on the water's surface is at its warmest and the humidity of the air is at its highest. Of the tropical storms that occur each year in the North Atlantic, only about five, on the average, are powerful enough to be called hurricanes. To be classified as a hurricane, a tropical storm must have winds reaching speeds of at least 117 kilometers per hour, but the winds are often much stronger than that; the winds of intense hurricanes can easily surpass 240 kilometers per hour.",

{q:"The passage MAINLY discusses",opts:["how many hurricanes occur each year","the strength of hurricanes","the weather in the North Atlantic","hurricanes in one part of the world"],ans:3,exp:"Passage membahas badai hurikan di kawasan Atlantik Utara secara spesifik."},
{q:"The BEST TITLE for this passage would be",opts:["The North Atlantic Ocean","Storms of the Northern Atlantic","Hurricanes: The Damage and Destruction","What Happens from May through November"],ans:1,exp:"Judul 'Storms of the Northern Atlantic' paling mencakup keseluruhan isi passage."}
]},
{title:"Henry Wadsworth Longfellow",text:"Henry Wadsworth Longfellow (1807–1882) was perhaps the best-known American poet of the nineteenth century. His clear writing style and emphasis on the prevalent values of the period made him popular with the general public if not always with the critics. He was particularly recognized for his longer narrative poems Evangeline, The Song of Hiawatha, and The Courtship of Miles Standish, in which he told stories from American history in terms of the values of the time. Evangeline was set during the French and Indian War (1754–1763), when the British forced French settlers from Nova Scotia; two lovers, Gabriel and Evangeline, were separated by the British. In The Song of Hiawatha, Longfellow depicted the noble life of the American Indian through the story of the brave Hiawatha and his beloved wife Minehaha. The Courtship of Miles Standish takes place during the early period of the settlement of New England. In this poem centered around a love triangle, Miles Standish asks his friend John Alden to propose to Priscilla Mullins for him; John Alden ends up marrying Priscilla Mullins himself.",

{q:"Which of the following best describes the MAIN IDEA of the passage?",opts:["American history is often depicted in poetry.","Longfellow described American history even though people really did not enjoy it.","The popularity of Longfellow's poems results from his stress on the values of the people.","Longfellow wrote long narrative poems that were not always popular with the critics."],ans:2,exp:"Ide utama: popularitas Longfellow berasal dari penekanannya pada nilai-nilai yang dipegang masyarakat."},
{q:"The BEST TITLE of the passage is",opts:["Longfellow's Popular Appeal","Historical Narrative Poems","The Lyric, Dramatic, and Narrative Poems of Longfellow","Longfellow and the Critics"],ans:0,exp:"Judul terbaik: 'Longfellow's Popular Appeal' — fokus pada daya tarik populer puisinya."},
{q:"The SUBJECT of the fourth paragraph is",opts:["nobility and honor in the poems of Longfellow","the love triangle involving Miles Standish","the popular appeal of The Courtship of Miles Standish","the period of the early settlement of New England"],ans:2,exp:"Paragraf keempat membahas popularitas 'The Courtship of Miles Standish.'"}

ex2:{label:"Exercise 2 — Organization",type:"exercise",skill:"Skill 2",

{title:"Conflict in Organizations",text:"Conflict within an organization is not always viewed as undesirable. In fact, various managers have widely divergent ideas on the value that conflict can have. According to the traditional view of conflict, conflict is harmful to an organization. Managers with this traditional view see it as their role to rid the organization of any possible sources of conflict. The interactionist view of conflict, on the other hand, holds that conflict can serve an important function in an organization by reducing complacency among workers and causing positive changes to occur. Managers who hold an interactionist view may actually take steps to stimulate conflict within the organization.",
qs:[
{q:"How is the information in the passage ORGANIZED?",opts:["The origin of ideas about conflict is presented.","Contrasting views of conflict are presented.","Two theorists discuss the strengths and weaknesses of their views.","Examples of conflict within organizations are presented."],ans:1,exp:"Organisasi informasi: dua pandangan yang berlawanan (traditional vs. interactionist) disajikan secara kontras."},
{q:"Click on the paragraph that supports the view that organizational conflict can be BENEFICIAL.",opts:["Paragraph 1","Paragraph 2","Paragraph 3 (Interactionist view)","Paragraph 4"],ans:2,exp:"Paragraf yang membahas pandangan interaksionist menjelaskan manfaat konflik."}
]},
{title:"IQ — Intelligence Quotient",text:"IQ, or intelligence quotient, is defined as the ratio of a person's mental age to chronological age, with the ratio multiplied by 100 to remove the decimal. Chronological age is easily determined; mental age is generally measured by some kind of standard test. In theory, a standardized IQ test is set up to measure an individual's ability to perform intellectual operations such as reasoning and problem solving. These intellectual operations are considered to represent intelligence. In practice, it has been impossible to arrive at consensus as to which types of intellectual operations demonstrate intelligence. Furthermore, it has been impossible to devise a test without cultural bias — any IQ tests so far proposed have been shown to reflect the culture of the test makers. Test takers from that culture would score higher on such a test than test takers from a different culture with equal intelligence.",
qs:[
{q:"What type of information is included in the FIRST paragraph?",opts:["An argument","A definition","An opinion","A theory"],ans:1,exp:"Paragraf pertama berisi definisi IQ."},
{q:"Click on the paragraph that describes the APPLICATION of IQ in the real world.",opts:["Paragraph 1","Paragraph 2","Paragraph 3 (real-world application)","Paragraph 4"],ans:2,exp:"Paragraf tentang aplikasi nyata IQ (dengan batasan bias budaya)."}
]},
{title:"The Great Salt Lake",text:"The largest lake in the western United States is the Great Salt Lake, an inland saltwater lake in northwestern Utah, just outside the state capital of Salt Lake City. Rivers and streams feed into the Great Salt Lake, but none drain out of it; this has a major influence on both the salt content and the size of the lake. Although the Great Salt Lake is fed by freshwater streams, it is actually saltier than the oceans of the world. The salt comes from the more than two million tons of minerals that flow into the lake each year from the rivers and creeks that feed it. Sodium and chloride — the components of salt — comprise the large majority of the lake's mineral content. The Great Salt Lake can vary tremendously from its normal size of 1,700 square miles, depending on long-term weather conditions. During periods of heavy rains, the size of the lake can swell tremendously; in 1980 the lake reached a size of 2,400 square miles. During periods of dry weather, the size of the lake decreases, sometimes drastically, due to evaporation.",
qs:[
{q:"How is the information in the passage ORGANIZED?",opts:["Two unusual characteristics of the Great Salt Lake are discussed.","Contrasting theories about the Great Salt Lake's salt levels are presented.","The process by which the Great Salt Lake gets its salt is outlined.","The reasons for variations in the lake's size are given."],ans:0,exp:"Dua karakteristik tidak biasa dibahas: kadar garam yang tinggi dan ukuran yang berubah-ubah."},
{q:"Click on the paragraph that explains WHERE the Great Salt Lake gets its salt.",opts:["Paragraph 1","Paragraph 2 (salt source)","Paragraph 3","Paragraph 4"],ans:1,exp:"Paragraf 2 menjelaskan sumber garam dari mineral yang mengalir masuk."}
]}
]},

{title:"The Human Heart",text:"The human heart is divided into four chambers, each of which serves its own function in the cycle of pumping blood. The atria are the thin-walled upper chambers that gather blood as it flows from the veins between heartbeats. The ventricles are the thick-walled lower chambers that receive blood from the atria and push it into the arteries with each contraction of the heart. The left atrium and ventricle work separately from those on the right. The role of the chambers on the right side of the heart is to receive oxygen-depleted blood from the body tissues and send it on to the lungs; the chambers on the left side of the heart then receive the oxygen-enriched blood from the lungs and send it back out to the body tissues.",
qs:[
{q:"The passage indicates that the ventricles",opts:["have relatively thin walls","send blood to the atria","are above the atria","force blood into the arteries"],ans:3,exp:"Disebutkan langsung: ventricles 'push it into the arteries with each contraction of the heart.'"},
{q:"According to the passage, WHEN is blood pushed into the arteries from the ventricles?",opts:["As the heart beats","Between heartbeats","Before each contraction of the heart","Before it is received by the atria"],ans:0,exp:"'push it into the arteries with each contraction of the heart' = as the heart beats."}
]},
{title:"The Golden Age of Railroads",text:"The Golden Age of Railroads refers to the period from the end of the Civil War to the beginning of World War I when railroads flourished and maintained a near monopoly in mass transportation in the United States. One of the significant developments during the period was the notable increase in uniformity, particularly through the standardization of track gauge and time. At the end of the Civil War, only about half of the nation's railroad track was laid at what is now the standard gauge of 1.4 meters; much of the rest had a 1.5-meter gauge. During the postwar years, tracks were converted to the 1.4-meter gauge, and by June 1, 1886, the standardization of tracks was completed. A further boon to railroad efficiency was the implementation of standard time in 1883. With the adoption of standard time, four time zones were established across the country.",
qs:[
{q:"According to the passage, the Golden Age of Railroads",opts:["was a result of World War I","was a period when most of U.S. mass transportation was controlled by the railroads","resulted in a decrease in uniformity of track gauge","resulted in standardization of train stations"],ans:1,exp:"Disebutkan: railroads 'maintained a near monopoly in mass transportation.'"},
{q:"The passage mentions that which of the following occurred as a result of UNIFORMITY of track gauge?",opts:["The Civil War","Improved economy in the transportation system","Standardization of time zones","Railroad schedules"],ans:1,exp:"Disebutkan: standardization resulted in 'increased efficiency and economy in the rail system.'"},
{q:"The passage indicates that standard time was implemented",opts:["before the Civil War","on June 1, 1886","after World War I","before standardized track gauge was established throughout the United States"],ans:3,exp:"Track gauge standardized by June 1, 1886; standard time implemented in 1883 — so standard time was BEFORE track gauge was fully standardized."}
]}
]},

{title:"Dekanawida",text:"Dekanawida's role as a supreme lawgiver in the Iroquois tribe has given him the status of demigod within the Indian nation. Born into the Huron tribe, Dekanawida caused great fear in his parents, who tried to drown him in his youth after a prophecy was made indicating that he would bring great sorrow to the Huron nation. Dekanawida survived this attempted drowning but later left his parents' home and tribe to live among the Iroquois. One of his achievements with the Iroquois was the institution of a law that virtually ended blood feuds among the nation's families. Wampum, strings of beads made of polished shells, was a valued commodity in the Iroquois culture; according to policies established by Dekanawida, wampum had to be paid to the family of a murder victim by the family of the killer. Since the killer was also put to death, the family of the killer had to pay the victim's family in wampum for two deaths.",

{title:"Eskimo Boats: Kayak and Umiak",text:"Eskimos need efficient and adequate means to travel across water in that the areas where they live are surrounded by oceans, bays, and inlets and dotted with lakes and seas. Two different types of boats have been developed by the Eskimos, each constructed to meet specific needs. The kayak is something like a canoe that has been covered by a deck. A kayak is generally constructed with one opening in the deck for one rider; however, some kayaks are made for two. Because the deck of a kayak is covered over except for the hole for its rider, a kayak can tip over in the water and roll back up without filling with water and sinking. One of the primary uses of the kayak is for hunting. The umiak is not closed over, as is the kayak. Instead, it is an open boat that is built to hold ten to twelve passengers. Eskimos have numerous uses for the umiak: it is used to haul belongings from campsite to campsite, and it is used for hunting larger animals that are too big to be hunted in a kayak.",

{q:"It can be inferred from the passage that the Sierra Nevadas are",opts:["a type of giant redwood","a coastal community","a group of lakes","a mountain range"],ans:3,exp:"Giant sequoias tumbuh di 'western slopes of the Sierra Nevadas' — tersirat ini adalah pegunungan."},

{title:"Monopoly",text:"Probably the most recognized board game around the world is the game of Monopoly. In this game, players vie for wealth by buying, selling, and renting properties; the key to success, in addition to a bit of luck, is for a player to acquire monopolies on clusters of properties in order to force opponents to pay exorbitant rents and fees. Although the game is now published in countless languages and versions with foreign locations appropriate to the target language adorning its board, the beginnings of the game were considerably more humble. The game was invented in 1933 by Charles Darrow, during the height of the Great Depression. Darrow, who lived in Germantown, Pennsylvania, was himself unemployed during those difficult financial times. He set the original game not in his hometown of Germantown, but in Atlantic City, New Jersey, the site of numerous pre-Depression vacations, where he walked along the Boardwalk and visited Park Place. Darrow made the first games by hand and sold them locally until Parker Brothers purchased the rights to Monopoly in 1935.",

]}

{title:"Cosmos — TV Series",text:"Another program instrumental in the popularization of science was Cosmos. This series, broadcast on public television, dealt with topics and issues from varied fields of science. The principal writer and narrator of the program was Carl Sagan, a noted astronomer and Pulitzer Prize-winning author.",
qs:[
{q:"The paragraph PRECEDING this passage most probably discusses",opts:["a different scientific television series","Carl Sagan's scientific achievements","the Pulitzer Prize won by Carl Sagan","public television"],ans:0,exp:"Kata 'Another program' mengindikasikan ada program lain sebelumnya yang dibahas."},
{q:"The paragraph FOLLOWING this passage most likely contains information on",opts:["The popularity of science","The program Cosmos","The astronomer Carl Sagan","Topics and issues from various fields of science"],ans:2,exp:"Program Cosmos baru saja diperkenalkan — paragraf berikutnya kemungkinan membahas Carl Sagan lebih lanjut."}
]},
{title:"Tsunamis",text:"When a strong earthquake occurs on the ocean floor rather than on land, a tremendous force is exerted on the seawater and one or more large, destructive waves called tsunamis can be formed. Tsunamis are commonly called tidal waves in the United States, but this is really an inappropriate name in that the cause of the tsunami is an underground earthquake rather than the ocean's tides. Far from land, a tsunami can move through the wide open ocean at a speed of 600 miles (900 kilometers) per hour. When a tsunami reaches shallow coastal water, it can reach a height of 100 feet (30 meters) or more and can cause tremendous flooding and damage to coastal areas.",
qs:[
{q:"The paragraph PRECEDING the passage most probably discusses",opts:["tsunamis in various parts of the world","the negative effects of tsunamis","land-based earthquakes","the effect of tides on tsunamis"],ans:2,exp:"Kalimat pertama: 'When a strong earthquake occurs on the OCEAN FLOOR rather than on LAND' — tersirat paragraf sebelumnya membahas gempa di darat."},
{q:"Which of the following is most likely the topic of the paragraph FOLLOWING the passage?",opts:["The causes of tsunamis","The destructive effects of tsunamis on the coast","The differences between tsunamis and tidal waves","The distances covered by tsunamis"],ans:1,exp:"Passage berakhir dengan 'flooding and damage to coastal areas' — paragraf berikutnya kemungkinan mendetailkan efek destruktif tersebut."}
]},
{title:"Marriage Laws",text:"While draft laws are federal laws, marriage laws are state laws rather than federal; marriage regulations are therefore not uniform throughout the country. The legal marriage age serves as an example of this lack of conformity. In most states, both the man and the woman must be at least eighteen years old to marry without parental consent; however, the states of Nebraska and Wyoming require the couple to be at least nineteen, while the minimum age in Mississippi is twenty-one. If parental permission is given, then a couple can marry at sixteen in some states, and a few states even allow marriage before the age of sixteen.",
qs:[
{q:"The paragraph PRECEDING the passage most probably discusses",opts:["state marriage laws","the lack of uniformity in marriage laws","federal draft laws","the minimum legal marriage age"],ans:2,exp:"Kalimat pertama menyebutkan 'draft laws are federal laws' sebagai kontras — tersirat paragraf sebelumnya membahas federal draft laws."},
{q:"The topic of the paragraph FOLLOWING the passage is most likely to be",opts:["disadvantages of youthful marriages","reasons why young people decide to marry","the age when parental consent for marriage is required","a discussion of why some states allow marriages before the age of sixteen"],ans:0,exp:"Passage berakhir dengan 'numerous negative effects of these young marriages' — paragraf berikutnya akan mendetailkan kerugian pernikahan muda."}
]}
]},

{title:"The Teddy Bear",text:"The teddy bear is a child's toy, a nice soft stuffed animal suitable for cuddling. It is, however, a toy with an interesting history behind it. Theodore Roosevelt, or Teddy as he was commonly called, was president of the United States from 1901 to 1909. He was an unusually active man with varied pastimes, one of which was hunting. One day the president was invited to take part in a bear hunt; a bear was captured, banged over the head to knock it out, and tied to a tree; however, Teddy refused to shoot the bear and demanded that the bear be extricated from the ropes; that is, he demanded that the bear be set free. The incident attracted a lot of attention among journalists. First a cartoon — drawn by Clifford K. Berryman to make fun of this situation — appeared in the Washington Post. Then toy manufacturers began producing a toy bear which they called a 'teddy bear.' The teddy bear became the most widely recognized symbol of Roosevelt's presidency.",
qs:[
{q:"According to line 1 of the passage, what is a 'teddy bear'?",opts:["A ferocious animal","The president of the United States","A famous hunter","A plaything"],ans:3,exp:"'a child's toy' = a plaything (mainan)."},
{q:"The word 'pastimes' in paragraph 2 could best be replaced by",opts:["past occurrences","previous jobs","hunting trips","leisure activities"],ans:3,exp:"'pastimes' = kegiatan di waktu luang = leisure activities."},
{q:"In line 10, a 'cartoon' could best be described as",opts:["a newspaper","a type of teddy bear","a drawing with a message","a newspaper article"],ans:2,exp:"Karton dalam konteks ini = gambar karikatur untuk mengejek (to make fun of) = a drawing with a message."}
]},
{title:"Supernovae",text:"A supernova occurs when all of the hydrogen in the core of a huge star is transformed to iron and explodes. All stars die after their nuclear fuel has been exhausted. Stars with little mass die gradually, but those with relatively large mass die in a sudden explosion, a supernova. The sudden flash of light can then be followed by several weeks of extremely bright light, perhaps as much light as twenty million stars. Supernovae are not very common; they occur about once every hundred years in any galaxy. In 1987 a supernova that could be seen by the naked eye occurred in the Magellan Cloud, a galaxy close to the Milky Way. Scientists periodically detect supernovae in other galaxies; however, no supernovae have occurred in the Milky Way (the galaxy that includes Earth) since 1604. One very impressive supernova occurred in the Milky Way on July 4, 1054. There was a great explosion followed by three months of lighted skies, and historical chronicles of the time were full of accounts and unusual explanations for the misunderstood phenomenon.",
qs:[
{q:"A 'supernova' in line 1 is which of the following?",opts:["The iron component of a star","The core of a star","The hydrogen in a star","The explosion of a star"],ans:3,exp:"Supernova = ledakan bintang raksasa ketika hidrogennya habis."},
{q:"Which of the following best describes the 'Magellan Cloud'?",opts:["A galaxy inside the Milky Way","A cloud composed of hydrogen","A galaxy near Earth's galaxy","A cloud in the sky above the Earth"],ans:2,exp:"'a galaxy close to the Milky Way' — Magellan Cloud adalah galaksi yang dekat dengan galaksi kita."},
{q:"Click on the word that is closest in meaning to 'unusual occurrence'",opts:["chronicles","phenomenon","accounts","explanations"],ans:1,exp:"'phenomenon' = kejadian/fenomena yang tidak biasa."}
]}
]},

{title:"Juan Rodriguez Cabrillo",text:"Juan Rodriguez Cabrillo was a Portuguese-born explorer credited with the exploration of the coast of what is today the state of California. Early in his career he served with the Spanish army from 1520 to 1524 in Spain's quest for subjugation of the people in what are today Cuba, Mexico, and Guatemala. In 1541, he was ordered by Antonio de Mendoza, the Spanish ruler of Mexico, to explore the western coast of North America. Cabrillo set out in June of 1542 in command of two ships; he reached San Diego Bay on September 28, 1542, and claimed the terrain for Spain. The peninsula where he landed is today named Cabrillo Point in his honor. From San Diego, Cabrillo continued northward. By November 1542, he had reached as far north as San Francisco Bay, although he missed the entrance of the bay due to a huge storm. Soon after, with the approach of winter, he veered south and turned back to Mexico.",
qs:[
{q:"The word 'subjugation' in the passage is closest in meaning to",opts:["religion","flag","control","agreement"],ans:2,exp:"'subjugation' = penaklukan/kontrol atas suatu kelompok = control."},
{q:"The word 'terrain' in the passage is closest in meaning to",opts:["land","population","minerals","prosperity"],ans:0,exp:"'claimed the terrain for Spain' — terrain = wilayah/tanah = land."},
{q:"The word 'spectacular' in the passage is closest in meaning to",opts:["Ruggedly handsome","Visually exciting","Completely uneven","Unendingly boring"],ans:1,exp:"'spectacular California coastline' = pantai yang memukau secara visual = visually exciting."},
{q:"The word 'veered' in the passage is closest in meaning to",opts:["raced","sped","turned","stopped"],ans:2,exp:"'he veered south' = dia berbelok ke selatan = turned."}
]},
{title:"Checks and Balances",text:"Checks and balances are an important concept in the formation of the U.S. system of government as presented in the Constitution. Under this conception of government, each branch of government has built-in checks and limitations placed on it by one or more different branches to ensure that any one branch is not able to usurp total dominance over the government. Under the Constitution, the United States has a tripartite government, with power divided equally among the branches: the presidency, the legislature, and the judiciary. Each branch is given some authority over the other two to balance the power among the three branches. Congress can pass a law with a simple majority, but the president can veto such a law. Congress can then counteract the veto with a two-thirds majority. However, even if Congress passes a law, the Supreme Court can still declare the law unconstitutional if it finds that the law is contradictory to the guidelines presented in the Constitution.",
qs:[
{q:"The expression 'dominance over' in the passage is closest in meaning to",opts:["understanding of","dispute over","authority over","rejection of"],ans:2,exp:"'dominance over' = kekuasaan/otoritas atas = authority over."},
{q:"The word 'tripartite' in the passage suggests that something is",opts:["divided into three","totally democratic","powerfully constructed","evenly matched"],ans:0,exp:"'tri-' = tiga; 'partite' = bagian. Tripartite = terbagi dalam tiga bagian."},
{q:"The word 'counteract' in the passage is closest in meaning to",opts:["vote for","debate","surpass","work against"],ans:3,exp:"'counteract the veto' = melawan/menangkal = work against."},
{q:"'Contradictory to' is closest in meaning to which of the following?",opts:["In agreement with","Opposite to","Supported by","Similar"],ans:1,exp:"'contradictory to' = bertentangan dengan = opposite to."}
]}
]},

{title:"The Black Widow Spider",text:"The black widow is the most dangerous spider living in the United States. It is most common in the southern parts of the country, but it can be found throughout the country. The black widow got its name because the female has been known to kill the male after mating and, as a result, becomes a widow. The black widow is rather distinctive in appearance; it has a shiny globular body, the size and shape of a pea, and is marked on its underbelly with a red or yellow spot. The female is considerably more ample than the male, roughly four times larger on the average. If a human is bitten by a black widow, the spider's poison can cause severe illness and pain. Black widow bites have occasionally proved deadly, but it is certainly not the norm for black widow bites to be mortal.",
qs:[
{q:"In line 3, the word 'widow' means",opts:["a type of poison","the dead male spider","the human victim of the spider","a female whose mate has died"],ans:3,exp:"'widow' = janda; perempuan yang pasangannya telah meninggal = a female whose mate has died."},
{q:"The word 'globular' is closest in meaning to",opts:["flat","spherical","pointed","colored"],ans:1,exp:"'globular' = berbentuk bola = spherical."},
{q:"The word 'ample' in the passage indicates that the spider is",opts:["feminine","large","dotted with colors","normal"],ans:1,exp:"'ample' dalam konteks ini = besar/lebih besar = large."},
{q:"The word 'deadly' in paragraph 3 is closest in meaning to",opts:["painful","mortal","unusual","rare"],ans:1,exp:"'deadly' = mematikan = mortal. Keduanya digunakan dalam konteks yang sama."}
]},
{title:"Tornadoes",text:"Tornadoes occur throughout the world, but for reasons that scientists are not fully able to discern, the great majority occur in the United States. Approximately 700 tornadoes a year occur within the United States, and this comprises three-quarters of the worldwide total. Most of the U.S. tornadoes take place in the Midwest and in the southern states that border the Gulf of Mexico. In general, a tornado cuts a path of a few hundred yards and lasts less than an hour; an average tornado might propel itself at a speed of 15 or 20 miles per hour and therefore cover a distance of 20 or so miles. The most devastating tornado on record occurred on March 18, 1925, in the states of Missouri, Illinois, and Indiana. The path of this tornado was more than 200 miles long and a mile wide. The winds at the center of the storm swirled around at considerably more than 200 miles per hour. A total of 689 people died at the hands of this killer storm.",
qs:[
{q:"The word 'discern' in the passage is closest in meaning to",opts:["understand","prevent","study","explain"],ans:0,exp:"'discern' = memahami/mengetahui = understand."},
{q:"The word 'propel' could best be replaced by",opts:["move","develop","destroy","inhibit"],ans:0,exp:"'propel itself' = menggerakkan dirinya sendiri = move."},
{q:"Which of the following is closest in meaning to the word 'devastating'?",opts:["Described","Delicate","Destructive","Determined"],ans:2,exp:"'devastating' = sangat merusak = destructive."},
{q:"The word 'swirled' is closest in meaning to",opts:["decreased","rose","settled","circled"],ans:3,exp:"'swirled' = berputar melingkar = circled."}
]}
]},

{title:"The Piece of Eight",text:"The 'piece of eight' was the nickname of the Spanish 'peso,' which was the rough equivalent of the American dollar in early America; the peso was accepted coin in much of the Americas, particularly during the period when the stores of Spanish ships were regularly stripped by pirates and 'redistributed' throughout coastal towns. The nickname 'piece of eight' derived from the fact that the peso was equal to eight 'reals' and therefore had the numeral 8 stamped on it. The 'piece of eight' was sometimes actually cut into pieces, or bits, and one popular size was one-quarter of a 'piece of eight,' or two bits. As a consequence, the U.S. quarter of a dollar is sometimes referred to today as two-bits, particularly in the western part of the country.",
qs:[
{q:"The word 'rough' in the passage is closest in meaning to",opts:["unsmooth","mean","approximate","heavy"],ans:2,exp:"'rough equivalent' = kira-kira setara = approximate equivalent."},
{q:"'Stores' in the passage are probably",opts:["departments","markets","shops","supplies"],ans:3,exp:"'stores of Spanish ships' = persediaan/muatan kapal = supplies."},
{q:"The expression 'take it' could best be replaced by",opts:["hold","understand","possess","grab"],ans:1,exp:"'take it that the price is being given' = pahami/mengerti = understand."}
]},
{title:"Adam Smith's Wealth of Nations",text:"Although Wealth of Nations by Adam Smith appeared in 1776, it includes many of the ideas that economists still consider the foundation of private enterprise. The ideas put forth by Smith compose the basis of the philosophies of the school of thought called classical economics. According to Smith's ideas, free competition and free trade are vital in fostering the growth of an economy. The role of government in the economy is to ensure the ability of companies to compete freely. Smith, who was himself a Scot, lived during the period of the revolutions in America and in France. During this epoch, the predominant political thought was a strong belief in freedom and independence. Smith embraced economic ideas of free trade and competition which are right in line with these political ideas.",
qs:[
{q:"A 'school' in the passage is",opts:["a common belief","a college","a university","an educational institution"],ans:0,exp:"'school of thought' = aliran pemikiran = a common belief system."},
{q:"Which of the following is closest in meaning to the word 'free' in 'free competition'?",opts:["Cheap","No cost","Uncontrolled","Democratic"],ans:2,exp:"'free competition' = persaingan bebas/tanpa hambatan = uncontrolled."},
{q:"The word 'embraced' could best be replaced by",opts:["hugged","believed in","encircled","handed over"],ans:1,exp:"'embraced economic ideas' = menerima/mempercayai gagasan = believed in."}
]}
]},

{title:"Beavers",text:"Beavers generally live in family clusters consisting of six to ten members. One cluster would probably consist of two adults, one male and one female, and four to eight young beavers, or kits. A female beaver gives birth each spring to two to four babies at a time. These baby beavers live with their parents until they are two years old. In the springtime of their second year they are forced out of the family group to make room for the new babies. These two-year-old beavers then proceed to start new family clusters of their own.",

{q:"Where in the passage does the author indicate WHY the young beavers must leave their parents' home?",opts:["Line 1","Line 2","Line 3","Lines 4–5"],ans:3,exp:"Lines 4–5: 'they are forced out of the family group to make room for the new babies.'"}
]},
{title:"Chamber Music",text:"Chamber music received its name because it was originally intended to be performed in small rooms in private homes rather than huge concert halls or theaters. Today it has evolved into small ensemble music in which each performer plays an individual part. The compositions written for this type of performance can easily be classified into three distinct periods. In the earliest period (1450–1650), the viol and other instrumental families developed considerably, and instrumental music took its first steps toward equal footing with vocal music. In the second period (1650–1750), trio sonatas dominated. These ensemble compositions were often written for two violins and a cello; the harpsichord was also featured in various compositions. In the modern period (after 1750), the preponderance of chamber music was written for the string quartet, an ensemble composed of two violins, a viola, and a cello.",
qs:[
{q:"Where in the passage does the author discuss the MODERN DEFINITION of chamber music?",opts:["Lines 2–3","Lines 4–5","Lines 8–9","Lines 9–11"],ans:0,exp:"Lines 2–3: 'Today it has evolved into small ensemble music in which each performer plays an individual part.'"},
{q:"Which sentence DESCRIBES THE FIRST of the three periods?",opts:["The first sentence of paragraph 2","The second sentence of paragraph 2","The third sentence of paragraph 2","The last sentence of paragraph 2"],ans:1,exp:"Kalimat kedua paragraf 2: membahas periode pertama (1450–1650) dengan perkembangan viol."}
]},
{title:"Galvanization",text:"It is common practice to coat metals such as iron and steel with a protective layer of zinc or an alloy made from zinc mixed with aluminum, cadmium, or tin in a process known as 'galvanization.' The purpose of galvanization is to prevent the corrosion of the iron or steel. The most common method to galvanize metal is the hot-dip galvanizing process. In this process, the iron or steel is dipped into a hot bath of a zinc alloy to form a protective coating approximately .003 inches thick. Another method of galvanizing that is not as common is the process known as electrogalvanizing; in this process the metal is placed in a solution composed of zinc sulphate and water and is then charged electrically. This causes a thin layer of zinc to coat the metal. Zinc is effective in galvanizing metals in that zinc reacts more easily with oxygen than iron does. If iron is unprotected, it reacts with the oxygen in the air to form iron oxide, or rust, which leads to the corrosion of the iron.",
qs:[
{q:"Where in the passage does the author list the COMPONENTS of a zinc alloy?",opts:["Lines 1–2","Lines 4–6","Lines 9–10","Lines 11–12"],ans:0,exp:"Lines 1–2: 'zinc mixed with aluminum, cadmium, or tin' — komponen paduan zinc disebutkan di sini."},
{q:"Where in the passage does the author present the LESS ROUTINELY USED process of galvanization?",opts:["Lines 1–2","Lines 3–5","Lines 6–8","Lines 10–11"],ans:2,exp:"Lines 6–8 membahas electrogalvanizing sebagai metode yang 'not as common.'"}
]}
]},

{title:"In Cold Blood — Truman Capote",text:"Truman Capote's In Cold Blood (1966) is a well-known example of the 'nonfiction novel,' a popular type of writing based upon factual events in which the author attempts to describe the underlying forces, thoughts, and emotions that lead to actual events. In Capote's book, the author describes the sadistic murder of a family on a Kansas farm, often showing the point of view of the killers. To research the book, Capote interviewed the murderers, and he maintains that his book presents a faithful reconstruction of the incident.",
qs:[
{q:"The PURPOSE of this passage is to",opts:["discuss an example of a particular literary genre","tell the story of In Cold Blood","explain Truman Capote's reasons for writing","describe how Truman Capote researched his nonfiction novel"],ans:0,exp:"Tujuan passage: membahas 'In Cold Blood' sebagai contoh genre 'nonfiction novel.'"},
{q:"Which of the following best describes the TONE of the passage?",opts:["Cold","Sadistic","Emotional","Descriptive"],ans:3,exp:"Nada passage: deskriptif/informatif — menggambarkan karya tanpa emosi berlebihan."},
{q:"This passage would probably be assigned reading in which of the following courses?",opts:["Criminal Law","American History","Modern American Novels","Literary Research"],ans:2,exp:"Passage tentang novel Amerika modern → paling sesuai untuk kursus Modern American Novels."}
]},
{title:"Hypnosis and Legal Confessions",text:"Up to now, confessions that have been obtained from defendants in a hypnotic state have not been admitted into evidence by courts in the United States. Experts in the field of hypnosis have found that such confessions are not completely reliable. Subjects in a hypnotic state may confess to crimes they did not commit: either they fantasize that they committed the crimes, or they believe that others want them to confess. A landmark case concerning a confession obtained under hypnosis went all the way to the U.S. Supreme Court. In the case of Layra v. Denno, a suspect was hypnotized by a psychiatrist for the district attorney; in a posthypnotic state the suspect signed three separate confessions to a murder. The Supreme Court ruled that the confessions were invalid because the confessions had been the only evidence against him.",
qs:[
{q:"Which of the following best describes the AUTHOR'S PURPOSE in this passage?",opts:["To explain the details of a specific court case","To demonstrate why confessions made under hypnosis are not reliable","To clarify the role of the Supreme Court in invalidating confessions","To explain the legal status of hypnotically induced confessions"],ans:3,exp:"Tujuan utama: menjelaskan status hukum pengakuan di bawah hipnosis."},
{q:"The TONE of this passage could best be described as",opts:["outraged","judicial","hypnotic","informative"],ans:3,exp:"Nada passage: informatif — menyajikan fakta hukum tanpa opini emosional."},
{q:"This passage would probably be assigned reading in a course on",opts:["American law","psychiatric healing","parapsychology","philosophy"],ans:0,exp:"Topik hukum dan pengadilan → paling sesuai untuk kursus American law."}
]},
{title:"Deforestation",text:"The rate at which the deforestation of the world is proceeding is alarming. In 1950 approximately 25 percent of the earth's land surface had been covered with forests, and less than twenty-five years later the amount of forest land was reduced to 20 percent. This decrease from 25 percent to 20 percent from 1950 to 1973 represents an astounding 20 million square kilometers of forests. Predictions are that an additional 20 million square kilometers of forest land will be lost by 2020. The majority of deforestation is occurring in tropical forests in developing countries, fueled by the developing countries' need for increased agricultural land and the desire on the part of developed countries to import wood and wood products. More than 90 percent of the plywood used in the United States is imported from developing countries with tropical rain forests. By the mid-1980s, solutions to this expanding problem were being sought in the form of attempts to establish an international regulatory organization to oversee the use of tropical forests.",
qs:[
{q:"The AUTHOR'S MAIN PURPOSE in this passage is to",opts:["cite statistics about an improvement on the earth's land surface","explain where deforestation is occurring","make the reader aware of a worsening world problem","blame developing countries for deforestation"],ans:2,exp:"Tujuan penulis: menyadarkan pembaca tentang masalah deforestasi yang semakin memburuk."},
{q:"Which of the following best describes the TONE of the passage?",opts:["Concerned","Disinterested","Placid","Exaggerated"],ans:0,exp:"Nada passage: prihatin/khawatir (concerned) — kata-kata seperti 'alarming' dan 'astounding' menunjukkan kekhawatiran."},
{q:"This passage would probably be assigned reading in which course?",opts:["Geology","Geography","Geometry","Marine Biology"],ans:1,exp:"Topik distribusi hutan di dunia → paling sesuai untuk Geography."}
]}
]},

{title:"Lions Hunting in Groups",text:"Something unusual about lions is that they hunt in groups. Group hunting is beneficial to lions because it means that much larger prey can be captured and individual lions expend much less energy. There is a standard pattern to the process of hunting in groups. The process is initiated by a single female, who stations herself at a raised elevation to serve as a lookout. When prey is spotted, a group of young lionesses advances on the herd and pushes it in the direction of a different lioness who has hidden herself downwind. It is up to this concealed female to choose the weakest member of the herd for the kill. As can be seen from this description, it is the females rather than the males in the pride that take part in the kill. While the young and strong females are on the attack, the males stay behind to protect the rest of the pride from attack from predators such as hyenas.",
qs:[
{q:"'Other cats do not.' — Where would this sentence BEST FIT in paragraph 1?",opts:["After sentence 1 (after 'hunt in groups')","After sentence 2 (after 'much less energy')","Before sentence 1","As the last sentence of paragraph 1"],ans:0,exp:"Setelah pernyataan 'lions hunt in groups,' kalimat 'Other cats do not' memberikan kontras langsung."},
{q:"'This is usually accomplished by knocking the prey to the ground and breaking its neck.' — Where would this sentence BEST FIT in paragraph 2?",opts:["After the sentence about the lookout","After the sentence about advancing lionesses","After the sentence about the concealed female","At the end of paragraph 2"],ans:3,exp:"Kalimat ini menjelaskan bagaimana pembunuhan dilakukan — paling tepat setelah kalimat tentang 'choose the weakest member for the kill.'"},
{q:"'The males have a defensive rather than an offensive role.' — Where would this sentence BEST FIT in paragraph 3?",opts:["After the first sentence of paragraph 3","After the sentence about males staying behind","At the beginning of paragraph 3","As the last sentence"],ans:0,exp:"Setelah kalimat pertama yang memperkenalkan peran perempuan, kalimat ini memberi kontras tentang peran jantan."}
]},
{title:"The Leotard and the Popsicle",text:"A number of products that we commonly use today were developed quite by accident. Two examples are the leotard and the popsicle, each of which came about when an insightful person recognized a potential benefit in a negative situation. The first of these accidental inventions is the leotard, a close-fitting, one-piece garment worn today by dancers and gymnasts. In 1828, a circus performer named Nelson Hower was faced with the prospect of missing his performance because his costume was at the cleaners. Instead of canceling his part of the show, he decided to perform in his long underwear. Soon, other circus performers began performing the same way. When popular acrobat Jules Leotard adopted the style, it became known as the leotard. Another product invented by chance was the popsicle. In 1905, eleven-year-old Frank Epperson stirred up a drink of fruit-flavored powder and soda water and then mistakenly left the drink, with the spoon in it, out on the back porch overnight. As the temperature dropped that night, the soda water froze around the spoon, creating a tasty treat. Years later, remembering how enjoyable the treat had been, Epperson went into business producing popsicles.",
qs:[
{q:"'They enjoyed the comfort of performing in underwear rather than costumes.' — Where would this fit in PARAGRAPH 2 (leotard story)?",opts:["After 'his costume was at the cleaners'","After 'he decided to perform in his long underwear'","After 'other circus performers began performing the same way'","After 'it became known as the leotard'"],ans:2,exp:"Setelah 'other circus performers began performing the same way' — kalimat ini menjelaskan MENGAPA mereka mengikutinya."},
{q:"'It was a taste sensation that stayed on his mind.' — Where would this fit in PARAGRAPH 3 (popsicle story)?",opts:["After 'soda water froze around the spoon'","After 'creating a tasty treat'","After 'Years later'","After 'Epperson went into business'"],ans:1,exp:"Setelah 'creating a tasty treat' — kalimat ini menjelaskan dampak dari pengalaman tersebut."}
]}

{title:"James Whistler — American Artist",text:"The next artist in this survey of American artists is James Whistler; he is included in this survey because he was born in the United States, although the majority of his artwork was completed in Europe. Whistler was born in Massachusetts in 1834, but nine years later his father moved the family to St. Petersburg, Russia, to work on the construction of a railroad. The family returned to the United States in 1849. Two years later Whistler entered the U.S. military academy at West Point, but he was unable to graduate. At the age of twenty-one, Whistler went to Europe to study art despite familial objections, and he remained in Europe until his death. Whistler worked in various art forms, including etchings and lithographs. However, he is most famous for his paintings, particularly Arrangement in Gray and Black No. 1: Portrait of the Artist's Mother, or Whistler's Mother as it is more commonly known. This painting shows a side view of Whistler's mother, dressed in black and posing against a gray wall. The asymmetrical nature of the portrait, with his mother seated off-center, is highly characteristic of Whistler's work.",

{title:"No-Fault Divorce",text:"It has been noted that, traditionally, courts have granted divorces on fault grounds: one spouse is deemed to be at fault in causing the divorce. More and more today, however, divorces are being granted on a no-fault basis. Proponents of no-fault divorce argue that when a marriage fails, it is rarely the case that one marriage partner is completely to blame and the other blameless. A failed marriage is much more often the result of mistakes by both partners. Another argument in favor of no-fault divorce is that proving fault in court is a destructive process that only serves to lengthen the divorce process and dramatically increases the negative feelings present in a divorce. If a couple can reach a decision to divorce without first deciding which partner is to blame, the divorce settlement can be negotiated more easily and equitably and the postdivorce healing process can begin more rapidly.",

{title:"Revolutionary American Literature",text:"Whereas literature in the first half of the eighteenth century in America had been largely religious and moral in tone, by the latter half of the century the revolutionary fervor that was coming to life in the colonies began to be reflected in the literature of the time, which in turn served to further influence the population. Although not all writers of this period supported the Revolution, the two best-known and most influential writers, Ben Franklin and Thomas Paine, were both strongly supportive of that cause. Ben Franklin first attained popular success through his writings in his brother's newspaper, the New England Current. In these articles he used a simple style of language and common sense argumentation to defend the point of view of the farmer and the common man. He continued with the same approach with his work on Poor Richard's Almanac from 1733 until 1758. Thomas Paine was an Englishman working as a magazine editor in Philadelphia at the time of the Revolution. His pamphlet Common Sense, which appeared in 1776, was a force in encouraging the colonists to declare their independence from England. Then throughout the long and desperate war years he published a series of Crisis papers to encourage the colonists to continue the struggle. The effectiveness of his writing was probably due to his emotional yet oversimplified depiction of the cause of the colonists against England as a classic struggle of good and evil.",

{q:"According to the passage, the tone of Poor Richard's Almanac is",opts:["pragmatic","erudite","theoretical","scholarly"],ans:0,exp:"Franklin menggunakan 'common sense argumentation' dan berfokus pada kaum petani → pragmatis."},

{title:"The Battle of New Orleans",text:"The final battle of the War of 1812 was the Battle of New Orleans. This battle gave a clear demonstration of the need for effective communication during wartime; it also showed the disastrous results that can come to pass when communication is inadequate. The War of 1812 was fought between Great Britain and the United States. The United States had declared war against Britain in June of 1812, mostly because of interference with U.S. shipping by the British and because of the shanghaiing of U.S. sailors for enforced service on British vessels. The war lasted for a little more than two years, when a peace treaty was signed at Ghent, in Belgium, on the 24th of December, 1814. Unfortunately, the news that the Treaty of Ghent had been signed was not communicated in a timely manner over the wide distance to where the war was being contested. Early in January of 1815, some two weeks after the peace treaty had been signed, British troops in the southern part of the United States were unaware that the war had officially ended. Over 5,000 British troops attacked U.S. troops. During the ensuing battle, the British suffered around 2,000 casualties, and the Americans lost 71 — all in a battle fought only because news of the peace treaty that had already been signed in Ghent had not yet reached the battlefield.",

{q:"It is NOT stated in the passage that Ghent was",opts:["where negotiations took place","the site of the final battle","where the treaty was signed","far from the battlefield"],ans:1,exp:"Ghent adalah tempat penandatanganan perjanjian, BUKAN pertempuran terakhir. Itu adalah New Orleans."},

]},
{title:"The Ozone Layer",text:"Although only a small percentage of the electromagnetic radiation emitted by the Sun is ultraviolet (UV) radiation, the amount that is emitted would be enough to cause severe damage to most forms of life on Earth were it all to reach the surface. Fortunately, all of the Sun's ultraviolet radiation does not reach the earth because of a layer of oxygen, called the ozone layer, encircling the earth in the stratosphere at an altitude of about 15 miles above the earth. The ozone layer absorbs much of the Sun's ultraviolet radiation and prevents it from reaching the earth. Ozone is a form of oxygen in which each molecule consists of three atoms (O₃) instead of the two atoms (O₂) usually found in an oxygen molecule. Ozone forms in the stratosphere in a process initiated by ultraviolet radiation from the Sun. UV radiation splits oxygen molecules into free oxygen atoms, and each of these unattached oxygen atoms then joins up with an oxygen molecule to form ozone. UV radiation is also capable of splitting up ozone molecules; thus, ozone is constantly forming, splitting, and reforming in the stratosphere. Recently, however, the ozone layer over parts of the earth has been diminishing. Chief among the culprits are the chlorofluorocarbons (CFCs). CFCs meander up from Earth into the stratosphere, where they break down and release chlorine. The released chlorine reacts with ozone to form chlorine monoxide (ClO) and oxygen (O₂). One chlorine atom can destroy hundreds of thousands of ozone molecules in this repetitious cycle.",
qs:[
{q:"According to the passage, ultraviolet radiation from the Sun",opts:["is causing severe damage to the earth's ozone layer","is only a fraction of the Sun's electromagnetic radiation","creates electromagnetic radiation","always reaches the earth"],ans:1,exp:"'only a small percentage of the electromagnetic radiation...is ultraviolet radiation.'"},
{q:"The word 'encircling' is closest in meaning to",opts:["rotating","attacking","raising","surrounding"],ans:3,exp:"'encircling the earth' = mengelilingi bumi = surrounding."},

{q:"Ultraviolet radiation causes oxygen molecules to",opts:["rise to the stratosphere","burn up ozone molecules","split up and reform as ozone","reduce the number of chlorofluorocarbons"],ans:2,exp:"UV radiation 'splits oxygen molecules...and each...then joins up...to form ozone' = split up and reform as ozone."}
]},
{title:"Esperanto",text:"Esperanto is what is called a planned, or artificial, language. It was created more than a century ago by Polish eye doctor Ludwik Lazar Zamenhof. Zamenhof believed that a common language would help to alleviate some of the misunderstandings among cultures. In Zamenhof's first attempt at a universal language, he tried to create a language that was as uncomplicated as possible, with words such as ab, ac, ba, eb, and be — monosyllabic words that were not easy to understand or to retain. Next, Zamenhof tried a different way. He made the words in his language sound like words that people already knew, but he simplified the grammar tremendously. All nouns end in -o, as in amiko ('friend'), and all adjectives end in -a, as in bela ('pretty'). The prefix mal- makes a word opposite in meaning; malamiko means 'enemy,' and malbela means 'ugly.' In 1887, Zamenhof wrote a description of this language and published it using a penname, Dr. Esperanto, which means 'a person who hopes.' Esperanto clubs began popping up throughout Europe, and by 1905 Esperanto had spread from Europe to America and Asia. In 1905, the First World Congress of Esperanto took place in France, with approximately 700 attendees from 20 different countries. Congresses were held annually for nine years, and 4,000 attendees were registered for the Tenth World Esperanto Congress scheduled for 1914, when World War I erupted and forced its cancellation. Today, it is estimated that perhaps a quarter of a million people are fluent in it. Current advocates would like to see its use grow considerably.",
qs:[
{q:"The TOPIC of this passage is",opts:["a language developed in the last few years","one man's efforts to create a universal language","how language can be improved","using language to communicate internationally"],ans:1,exp:"Passage berfokus pada upaya Zamenhof menciptakan bahasa universal Esperanto."},
{q:"According to the passage, Zamenhof wanted to create a universal language",opts:["to resolve cultural differences","to provide a more complex language","to build a name for himself","to create one world culture"],ans:0,exp:"'a common language would help to alleviate some of the misunderstandings among cultures.'"},
{q:"It can be INFERRED from the passage that the Esperanto word 'malespera' means",opts:["hopelessness","hope","hopeless","hopeful"],ans:2,exp:"'mal-' = lawan kata; 'espera' = berharap → 'malespera' = tidak berharap/hopeless."},
{q:"According to the passage, what happened to the Tenth World Esperanto Congress?",opts:["It had 4,000 attendees.","It was scheduled for 1915.","It had attendees from 20 countries.","It never took place."],ans:3,exp:"'World War I erupted and forced its cancellation' — kongres tidak pernah berlangsung."},
{q:"This passage would most likely be assigned reading in a course on",opts:["European history","English grammar","world government","applied linguistics"],ans:3,exp:"Topik bahasa buatan dan linguistik → applied linguistics."}
]},
{title:"Paul Bunyan",text:"Paul Bunyan is perhaps America's best-known folk hero. A fictional logger of incredible strength, he was most likely based on an actual nineteenth century logger from the northern United States or Canada. As a folk hero, he struck a chord with Americans, perhaps because he was incredibly strong but also because he was hard-working and capable, ingenious in solving problems, and fun-loving. Though there is evidence that Paul Bunyan tales were part of oral tradition in the nineteenth century, Paul Bunyan stories did not appear in written form until the early twentieth century. Journalist James McGillivray included descriptions of Bunyan in a series of essays entitled 'The Round River Drive,' which appeared in Midwestern newspapers between 1906 and 1910. However, it was through an extensive advertising campaign that Paul Bunyan moved solidly into print. William Laughead, an advertising executive for the Red River Lumber Company, initiated a campaign featuring Paul Bunyan. For several decades, the company distributed these publications free of charge and made no attempt to obtain a copyright on them. In fact, the company vigorously encouraged other writers to make use of Paul Bunyan because it felt that the use of this character enhanced the name recognition of the Red River Lumber Company. The Bunyan stories were tall tales of gigantic proportions. In these tales, Bunyan is depicted as a man of superhuman proportions — strong, hard-working, entrepreneurial, and innovative. In one story, Paul is credited with digging the Great Lakes to create a watering hole for his giant ox, Babe. In another, Paul caused an entire winter of blue snow to fall by swearing a blue streak after he injured himself.",
qs:[

{q:"It is NOT stated in the passage that Paul Bunyan is known for his",opts:["unusual strength","dedication to work","ingenuity in difficult situations","serious nature"],ans:3,exp:"Teks menyebutkan dia 'fun-loving' (suka bersenang-senang), bukan serius. D tidak disebutkan."},
{q:"The word 'interwoven' could best be replaced by",opts:["unfashionable","mixed together","not compatible","too separate"],ans:1,exp:"'interwoven' = terjalin/bercampur = mixed together."},

// ─── KEYS & ORDER ────────────────────────────────────────────────────────────
const KEYS = ['pretest','ex1','ex2','ex3','ex4','ex5','ex6','ex7','ex8','ex9','ex10','ex11','ex12','ex13','ex14'];

// ─── STATE ───────────────────────────────────────────────────────────────────
let state = {section:'pretest', passageIdx:0, qIdx:0, answers:{}, mode:'quiz'};

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function getKey(pIdx, qIdx){ return pIdx+'-'+qIdx; }
function totalQs(sec){
  return sec.passages.reduce((s,p)=>s+p.qs.length,0);
}
function answeredCount(sec, secKey){
  let c=0;
  sec.passages.forEach((p,pi)=>p.qs.forEach((_,qi)=>{ if(state.answers[secKey+'-'+pi+'-'+qi]!==undefined) c++; }));
  return c;
}
function correctCount(sec, secKey){
  let c=0;
  sec.passages.forEach((p,pi)=>p.qs.forEach((q,qi)=>{
    const a=state.answers[secKey+'-'+pi+'-'+qi];
    if(a!==undefined && a.idx===q.ans) c++;
  }));
  return c;
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render(){
  const root = document.getElementById('root');
  const secKey = state.section;
  const sec = DATA[secKey];
  const total = totalQs(sec);
  const answered = answeredCount(sec, secKey);
  const correct = correctCount(sec, secKey);

  const isPretest = secKey === 'pretest';
  const isExercise = sec.type === 'exercise';

  const badgeClass = isPretest ? 'badge-pretest' : isExercise ? 'badge-skill' : 'badge-test';
  const badgeLabel = isPretest ? '★ Pre-Test' : isExercise ? sec.skill : 'Test';

  // Header
  let h = `<div class="header"><h1>Longman TOEFL — Reading Comprehension</h1><p>Section Three: Reading Comprehension</p></div>`;

  // Tabs
  h += `<div class="tabs-wrap"><div class="tabs">`;
  KEYS.forEach(k => {
    const d = DATA[k];
    const isP = k === 'pretest';
    const cls = `tab${state.section===k?' active':''}${isP?' test-tab':''}`;
    h += `<button class="${cls}" onclick="chg('${k}')">${d.label}</button>`;
  });
  h += `</div></div>`;

  // Progress
  h += `<div class="progress-bar"><div class="progress-fill" style="width:${total?Math.round(answered/total*100):0}%"></div></div>`;

  // Stats
  h += `<div class="stats">
    <div class="stat"><div class="stat-num">${total}</div><div class="stat-lbl">Total</div></div>
    <div class="stat"><div class="stat-num">${answered}</div><div class="stat-lbl">Answered</div></div>
    <div class="stat"><div class="stat-num" style="color:#1a7a4a">${correct}</div><div class="stat-lbl">Correct</div></div>
    <div class="stat"><div class="stat-num" style="color:#b91c1c">${answered-correct}</div><div class="stat-lbl">Wrong</div></div>
  </div>`;

  // Score screen
  if(state.mode === 'result'){
    const pct = answered > 0 ? Math.round(correct/answered*100) : 0;
    h += `<div class="score-screen">
      <div class="score-big">${pct}%</div>
      <div class="score-label">${correct} of ${answered} correct — ${sec.label}</div>
      <div class="score-grid">
        <div class="stat"><div class="stat-num" style="color:#1a7a4a">${correct}</div><div class="stat-lbl">Correct</div></div>
        <div class="stat"><div class="stat-num" style="color:#b91c1c">${answered-correct}</div><div class="stat-lbl">Wrong</div></div>
        <div class="stat"><div class="stat-num">${total-answered}</div><div class="stat-lbl">Skipped</div></div>
      </div>
      <button class="nav-btn primary" onclick="rst()">Try Again</button>
      <button class="nav-btn" style="margin-left:8px" onclick="rev()">Review Answers</button>
    </div>`;
    root.innerHTML = h; return;
  }

  // Current passage & question
  const passage = sec.passages[state.passageIdx];
  const q = passage.qs[state.qIdx];
  const aKey = secKey+'-'+state.passageIdx+'-'+state.qIdx;
  const ua = state.answers[aKey];
  const done = ua !== undefined;

  // Note
  const noteClass = isPretest ? 'note note-test' : 'note note-skill';
  h += `<div class="${noteClass}">${sec.note}</div>`;

  // Passage box
  h += `<div class="card">`;
  h += `<div class="passage-label">${sec.skill} — Passage ${state.passageIdx+1} of ${sec.passages.length}</div>`;
  h += `<div class="passage-title">${passage.title}</div>`;
  h += `<div class="passage-box">${passage.text}</div>`;

  // Question
  h += `<div class="q-meta"><span class="badge ${badgeClass}">${badgeLabel}</span><span>${sec.label}</span><span>Q${state.qIdx+1} / ${passage.qs.length}</span></div>`;
  h += `<div class="question-text">${q.q}</div>`;

  // Options
  h += `<div class="options">`;
  q.opts.forEach((opt, i) => {
    let cls = 'opt' + (done ? ' disabled' : '');
    if(done){
      if(i === q.ans) cls += ' correct';
      else if(ua && i === ua.idx && ua.idx !== q.ans) cls += ' wrong';
    }
    h += `<div class="${cls}" onclick="${done?'':'sel('+i+')'}">`
       + `<span class="opt-label">${String.fromCharCode(65+i)}.</span><span>${opt}</span></div>`;
  });
  h += `</div>`;

  // Explanation
  if(done){
    const ok = ua.idx === q.ans;
    h += `<div class="explanation"><strong>${ok ? '✓ Correct!' : '✗ Incorrect.'}</strong> ${q.exp}</div>`;
  }

  // Navigation within passage
  const totalPassageQs = passage.qs.length;
  const hasPrevQ = state.qIdx > 0;
  const hasNextQ = state.qIdx < totalPassageQs - 1;
  const hasPrevP = state.passageIdx > 0;
  const hasNextP = state.passageIdx < sec.passages.length - 1;
  const isLastOfAll = !hasNextQ && !hasNextP;

  h += `<div class="nav">`;
  h += `<div style="display:flex;gap:6px">`;
  if(hasPrevQ) h += `<button class="nav-btn" onclick="prevQ()">← Q Prev</button>`;
  else if(hasPrevP) h += `<button class="nav-btn" onclick="prevP()">← Passage</button>`;
  else h += `<button class="nav-btn" disabled>← Prev</button>`;
  h += `</div>`;
  h += `<span class="q-counter">P${state.passageIdx+1} · Q${state.qIdx+1}/${totalPassageQs} · Total ${answered}/${total}</span>`;
  h += `<div style="display:flex;gap:6px">`;
  if(hasNextQ) h += `<button class="nav-btn primary" onclick="nextQ()">Next Q →</button>`;
  else if(hasNextP) h += `<button class="nav-btn primary" onclick="nextP()">Next Passage →</button>`;
  else h += `<button class="nav-btn primary" onclick="showR()">See Results</button>`;
  h += `</div></div>`;
  h += `</div>`;

  root.innerHTML = h;
}

// ─── ACTIONS ─────────────────────────────────────────────────────────────────
function sel(i){
  const sec = DATA[state.section];
  const q = sec.passages[state.passageIdx].qs[state.qIdx];
  const aKey = state.section+'-'+state.passageIdx+'-'+state.qIdx;
  state.answers[aKey] = {idx:i, correct:i===q.ans};
  render();
}
function nextQ(){ state.qIdx++; render(); }
function prevQ(){ state.qIdx--; render(); }
function nextP(){ state.passageIdx++; state.qIdx=0; render(); }
function prevP(){ state.passageIdx--; state.qIdx=DATA[state.section].passages[state.passageIdx].qs.length-1; render(); }
function chg(k){ state.section=k; state.passageIdx=0; state.qIdx=0; state.answers={}; state.mode='quiz'; render(); }
function showR(){ state.mode='result'; render(); }
function rst(){ state.passageIdx=0; state.qIdx=0; state.answers={}; state.mode='quiz'; render(); }
function rev(){ state.passageIdx=0; state.qIdx=0; state.mode='quiz'; render(); }

render();
</script>
</body>
</html>
